<!doctype html>
<meta charset="utf-8" />
<title>Iframe pixel fixture</title>
<style>
  html,
  body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #153243;
  }
  main {
    display: grid;
    grid-template-columns: 1fr 1fr;
    height: 100vh;
    gap: 20px;
    padding: 20px;
    box-sizing: border-box;
  }
  iframe {
    width: 100%;
    height: 100%;
    border: 0;
    background: white;
  }
</style>
<main>
  <iframe id="same-origin" src="/iframe-child.html" title="same origin"></iframe>
  <iframe
    id="cross-origin"
    src="http://127.0.0.1:4175/iframe-child.html"
    title="cross origin"
  ></iframe>
</main>

<!doctype html>
<meta charset="utf-8" />
<title>Canvas and WebGL fixture</title>
<style>
  html,
  body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: #f7f3e8;
  }
  main {
    display: grid;
    grid-template-columns: 1fr 1fr;
    height: 100vh;
    gap: 20px;
    padding: 20px;
    box-sizing: border-box;
  }
  canvas {
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
  }
</style>
<main>
  <canvas id="two-d" width="400" height="400"></canvas
  ><canvas id="webgl" width="400" height="400"></canvas>
</main>
<script>
  const twoD = document.querySelector("#two-d").getContext("2d");
  twoD.fillStyle = "#f4a261";
  twoD.fillRect(0, 0, 400, 400);
  twoD.fillStyle = "#264653";
  twoD.fillRect(100, 100, 200, 200);
  const canvas = document.querySelector("#webgl");
  const gl = canvas.getContext("webgl", { preserveDrawingBuffer: true });
  if (gl) {
    gl.clearColor(0.043, 0.431, 0.31, 1);
    gl.clear(gl.COLOR_BUFFER_BIT);
    document.body.dataset.webgl = "ready";
  } else {
    const fallback = canvas.getContext("2d");
    fallback.fillStyle = "#0b6e4f";
    fallback.fillRect(0, 0, 400, 400);
    document.body.dataset.webgl = "fallback";
  }
</script>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Infinite adaptive growth</title>
    <style>
      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
      }

      body {
        font-family: system-ui, sans-serif;
        background: #f7f3e8;
      }

      header {
        position: fixed;
        inset: 0 0 auto;
        z-index: 2;
        padding: 16px;
        background: #153f35;
        color: white;
      }

      .block {
        height: 1000px;
        padding: 96px 24px 24px;
        border-bottom: 4px solid #153f35;
        background: linear-gradient(180deg, #f7f3e8, #dce9d5);
      }
    </style>
  </head>
  <body>
    <header>Infinite growth fixture</header>
    <main id="content">
      <section class="block">Initial block 1</section>
      <section class="block">Initial block 2</section>
      <section class="block">Initial block 3</section>
    </main>
    <script>
      const content = document.querySelector("#content");
      let appended = 0;
      let scheduled = false;

      function appendBlock() {
        scheduled = false;
        appended += 1;
        const section = document.createElement("section");
        section.className = "block";
        section.textContent = `Infinite block ${appended}`;
        content?.append(section);
        document.body.dataset.appended = String(appended);
      }

      addEventListener(
        "scroll",
        () => {
          const nearBottom = scrollY + innerHeight >= document.documentElement.scrollHeight - 240;
          if (nearBottom && !scheduled) {
            scheduled = true;
            setTimeout(appendBlock, 40);
          }
        },
        { passive: true },
      );
    </script>
  </body>
</html>

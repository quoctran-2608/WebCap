<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebCap fixed and sticky fixture</title>
    <style>
      body { min-height: 3600px; margin: 0; font: 16px system-ui; }
      #fixed { position: fixed; inset: 0 0 auto; height: 56px; background: #203864; color: white; z-index: 10; }
      #sticky { position: sticky; top: 56px; margin-top: 700px; padding: 20px; background: #ffd36c; }
      #overlay { position: fixed; inset: 20px 20px auto auto; padding: 12px; background: #111; color: white; z-index: 100; }
      main { padding-top: 80px; }
    </style>
  </head>
  <body>
    <header id="fixed" style="opacity: 0.95">Fixed header</header>
    <div id="overlay" data-webcap-overlay-root style="visibility: visible">WebCap overlay</div>
    <main>
      <input id="focus-target" value="fixed focus" />
      <aside id="sticky">Sticky element</aside>
    </main>
  </body>
</html>

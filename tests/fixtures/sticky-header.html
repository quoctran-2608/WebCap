<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebCap sticky header fixture</title>
    <style>
      :root {
        font-family: system-ui, sans-serif;
        color-scheme: light;
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        background: #f1f5f9;
      }

      header {
        position: sticky;
        top: 0;
        z-index: 10;
        height: 64px;
        display: grid;
        place-items: center;
        color: white;
        background: #047857;
        font-weight: 700;
      }

      main {
        padding: 24px;
      }

      section {
        min-height: 520px;
        margin-bottom: 24px;
        padding: 24px;
        border-radius: 16px;
        background: white;
        border: 1px solid #94a3b8;
      }
    </style>
  </head>
  <body>
    <header id="sticky-header">STICKY HEADER</header>
    <main>
      <button id="focus-target" type="button">Điểm focus</button>
      <section><h1>Sticky fixture 1</h1></section>
      <section><h2>Sticky fixture 2</h2></section>
      <section><h2>Sticky fixture 3</h2></section>
      <section><h2>Sticky fixture 4</h2></section>
    </main>
  </body>
</html>

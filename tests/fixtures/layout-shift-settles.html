<!doctype html>
<meta charset="utf-8" />
<title>Settling layout fixture</title>
<style>
  body {
    margin: 0;
    font: 18px system-ui;
    background: #eef7f2;
  }
  #hero {
    height: 500px;
    background: #1f7a5b;
    color: white;
    display: grid;
    place-items: center;
  }
  #late {
    height: 300px;
    background: #f4a261;
    display: grid;
    place-items: center;
    transition: none;
  }
</style>
<div id="hero">Stable after bounded shifts</div>
<div id="late">Initial</div>
<script>
  setTimeout(() => {
    document.querySelector("#late").style.height = "520px";
  }, 80);
  setTimeout(() => {
    document.querySelector("#late").textContent = "Settled";
    document.body.dataset.settled = "true";
  }, 180);
</script>

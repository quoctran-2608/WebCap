name: S33 apply pending patches temp

on:
  push:
    branches: [agent/s33-recovery-quota-multipart-resilience]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/s33-recovery-quota-multipart-resilience
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply lifecycle and cleanup patches
        run: |
          python scripts/s33_export_lifecycle_patch.py
          python scripts/s33_cleanup_patch.py
      - name: Canonicalize S33 sources
        run: >-
          pnpm exec prettier --write
          src/background/pdf-capture-orchestrator.ts
          src/background/pdf-export-service.ts
          src/background/capture-completion-service.ts
          src/storage/pdf-output-spool.ts
          src/background/capture-data-cleanup-service.ts
          src/background/persistent-job-router.ts
          tests/unit/streaming-pdf-recovery-s33.test.ts
      - name: Record focused diagnostics without blocking source commit
        run: |
          pnpm typecheck || true
          pnpm exec vitest run tests/unit/pdf-capture-orchestrator.test.ts tests/unit/pdf-export-service.test.ts tests/unit/capture-completion-service.test.ts tests/unit/job-state-machine.test.ts tests/unit/capture-data-cleanup-service.test.ts tests/unit/capture-reset-service.test.ts tests/unit/persistent-job-router.test.ts tests/unit/streaming-pdf-recovery-s33.test.ts || true
      - name: Remove all temporary patch machinery
        run: rm -f scripts/s33_export_lifecycle_patch.py scripts/s33_cleanup_patch.py .github/workflows/s33-export-lifecycle-temp.yml .github/workflows/s33-cleanup-temp.yml
      - name: Commit pending S33 sources
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Implement S33 paused export recovery and ownership cleanup"
          git push origin HEAD:agent/s33-recovery-quota-multipart-resilience

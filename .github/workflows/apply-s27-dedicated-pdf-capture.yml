name: Apply S27 dedicated PDF capture

on:
  pull_request:
    types: [opened, synchronize]
    branches: [main]

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/s27-dedicated-pdf-capture'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out S27 branch
        uses: actions/checkout@v4
        with:
          ref: agent/s27-dedicated-pdf-capture
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply implementation
        run: |
          node scripts/apply-s27-dedicated-pdf-capture.mjs
          node scripts/apply-s27-typecheck-fix.mjs

      - name: Format implementation
        run: >-
          pnpm exec prettier --write
          src/shared/constants.ts
          src/shared/contracts/domain.ts
          src/shared/contracts/job.ts
          src/shared/contracts/scroll-area.ts
          src/capture/capture-engine.ts
          src/capture/document-page-map.ts
          src/capture/scroll-area-capture-engine.ts
          src/background/scroll-area-page-adapter.ts
          src/background/full-page-capture-coordinator.ts
          src/background/job-state-machine.ts
          src/background/pdf-export-service.ts
          src/content/entry.ts
          src/offscreen/pdf-layout.ts
          src/offscreen/pdf-exporter.ts
          tests/unit/document-page-map.test.ts
          tests/unit/pdf-layout.test.ts
          tests/unit/scroll-area-capture-engine.test.ts
          tests/unit/job-state-machine.test.ts

      - name: Typecheck
        run: pnpm typecheck

      - name: Focused regression tests
        run: >-
          pnpm exec vitest run
          tests/unit/document-page-map.test.ts
          tests/unit/pdf-layout.test.ts
          tests/unit/scroll-area-capture-engine.test.ts
          tests/unit/job-state-machine.test.ts

      - name: Commit implementation
        run: |
          git config user.name "webcap-agent"
          git config user.email "webcap-agent@users.noreply.github.com"
          git add src tests
          git commit -m "Build dedicated page-aware PDF capture pipeline"
          git push origin HEAD:agent/s27-dedicated-pdf-capture

name: Apply S25 event filter once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apply-s25-event-filter-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.head_ref == 'agent/s25-settings-events-popup'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out S25 branch
        uses: actions/checkout@v4
        with:
          ref: agent/s25-settings-events-popup
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply and validate event revision filter
        run: |
          python scripts/apply-s25-event-filter.py
          pnpm exec prettier --write src/popup/App.tsx src/popup/job-events-client.ts
          pnpm lint
          pnpm typecheck
      - name: Commit clean event filter candidate
        run: |
          git rm scripts/apply-s25-event-filter.py .github/workflows/apply-s25-event-filter-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src
          git commit -m "Centralize job event revision filtering"
          git push origin HEAD:agent/s25-settings-events-popup

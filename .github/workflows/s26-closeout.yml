name: S26 Closeout

on:
  push:
    branches: [agent/s26-hardening-rc]
    paths:
      - ".github/workflows/s26-closeout.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/s26-closeout.yml"

permissions:
  contents: write

concurrency:
  group: s26-closeout
  cancel-in-progress: true

jobs:
  closeout:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out latest S26 branch
        uses: actions/checkout@v4
        with:
          ref: agent/s26-hardening-rc
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Record final S26 evidence
        run: |
          python - <<'PY'
          from pathlib import Path

          package = "webcap-0.2.0.zip (25 entries, 1,195,785 bytes, SHA-256 a5e8a55d2e1038284199d702b27d57af8f351080b0c3d85c4019bc3a723a3e6d)"
          runs = "read-only CI run 31072090616 and Release Candidate run 31072090612"
          browsers = "Chrome 116.0.5845.96, previous stable 150.0.7871.124 and current stable 151.0.7922.76"

          def edit(path, replacements):
              file = Path(path)
              text = file.read_text()
              for old, new in replacements:
                  if old not in text:
                      raise SystemExit(f"Closeout target missing in {path}: {old}")
                  text = text.replace(old, new, 1)
              text = text.replace("{{S26_RUN_EVIDENCE}}", runs)
              text = text.replace("{{S26_PACKAGE_EVIDENCE}}", package)
              file.write_text(text)

          edit("PLAN.md", [
              ("status: Release candidate validation", "status: Release candidate complete"),
              ("current_session: S26-RC", "current_session: S26-DONE"),
              ("S21–S25 đã hoàn tất reset lifecycle, region selector đáng tin cậy, adaptive auto-scroll có resumable frontier, mode-aware output, stored settings, event-driven progress và simplified popup mà không thay manifest, package version hoặc artifact 0.1.0. S26 là session active tiếp theo.", "S21–S26 đã hoàn tất roadmap 0.2.0: reset lifecycle, reliable selectors, adaptive/resumable capture, mode-aware output, stored settings, event-driven progress, release migration và reproducible RC. Artifact 0.1.0 vẫn được giữ nguyên và 0.2.0 chưa được xuất bản."),
              ("| S26 | Gap closure hardening, migration, docs và RC 0.2.0 | IN VALIDATION | S21–S25 |", "| S26 | Gap closure hardening, migration, docs và RC 0.2.0 | DONE | S21–S25 |"),
              ("- S26 implementation gate: {{S26_RUN_EVIDENCE}}. Reproducible package: {{S26_PACKAGE_EVIDENCE}}.", f"- Final clean gates: {runs}; 344/344 unit tests on 99 files, 4/4 PDF benchmarks, 51/51 Playwright E2E, Linux/Windows/macOS lifecycle and {browsers}.\n- Reproducible package: {package}."),
              ("- AC-40 is pending the final read-only Release Candidate minimum/previous/current Chrome and OS matrix on the S26 PR.\n- S26 remains IN VALIDATION until those permanent read-only workflows pass with zero P0/P1, critical advisory or unresolved review thread.", f"- AC-40: PASS — packaged install/update/storage/uninstall passed on Linux, Windows and macOS plus {browsers}.\n- S26: DONE — AC-01–AC-40 pass, zero open P0/P1, zero critical advisory and zero unresolved review thread."),
              ("**Current session: S26 — Hardening, gap closure và release candidate 0.2.0.**\n\n1. Bắt đầu từ baseline S21–S25 đã merge và giữ nguyên semantics reset/selector/adaptive/output/settings/events.\n2. Rà `docs/audits/0.1.0-gap-audit.md`, acceptance AC-01–AC-40 và đóng mọi MUST/SHOULD bằng evidence hoặc disposition rõ.\n3. Kiểm thử migration 0.1.0 → 0.2.0, compatibility matrix, deterministic package và packaged lifecycle trên các target đã định.\n4. Chỉ bump package/manifest lên 0.2.0 trong S26; không thêm permission, backend, telemetry hoặc remote executable code.\n5. Không tag, tạo GitHub Release, upload Chrome Web Store hoặc publish nếu chưa có approval riêng.", "**Roadmap S21–S26 hoàn tất. WebCap 0.2.0 RC sẵn sàng để review.**\n\n1. Giữ PR S26 chưa merge cho đến khi được phê duyệt.\n2. Giữ nguyên publication boundary: không tag, GitHub Release, Chrome Web Store upload/submission/publication nếu chưa có release-owner approval riêng.\n3. Mọi công việc sau core 0.2.0 phải mở roadmap/PR riêng thay vì mở rộng RC này.")
          ])

          edit("README.md", [
              ("**WebCap 0.2.0 release-candidate implementation is complete and under final read-only validation.**", "**WebCap 0.2.0 release candidate is complete and ready for review.**"),
              ("The S26 implementation gate produced {{S26_PACKAGE_EVIDENCE}}. Final publication remains an explicit release-owner action.", f"The final {runs} verified {package}, Linux/Windows/macOS lifecycle, and {browsers}. Final publication remains an explicit release-owner action.")
          ])

          edit("CHANGELOG.md", [
              ("- Reproducible 0.2.0 release-candidate evidence: {{S26_PACKAGE_EVIDENCE}}.", f"- Reproducible 0.2.0 release-candidate evidence: {package}; {runs}; Linux/Windows/macOS lifecycle and {browsers} all pass.")
          ])

          edit("docs/audits/0.1.0-gap-audit.md", [
              ("| COMP-001                                   | IN FINAL VALIDATION | S26 Release Candidate workflow tests minimum, previous stable and current stable Chrome.   |", f"| COMP-001                                   | CLOSED              | S26 RC run 31072090612 passed Linux/Windows/macOS and {browsers}. |")
          ])

          edit("docs/release/acceptance-criteria-0.2.0.md", [
              ("Status: S26 implementation gate complete; final read-only Release Candidate matrix pending.", "Status: PASS — S26 release candidate complete and ready for review."),
              ("| AC-40       | PENDING FINAL RC | Minimum Chrome 116, previous stable, current stable and Linux/Windows/macOS packaged lifecycle workflow. |", f"| AC-40       | PASS             | RC run 31072090612 passed Linux/Windows/macOS lifecycle and {browsers}.                              |"),
              ("Implementation workflow: {{S26_RUN_EVIDENCE}}. Reproducible package: {{S26_PACKAGE_EVIDENCE}}.", f"Final evidence: {runs}. Reproducible package: {package}.")
          ])

          edit("docs/release-checklist-0.2.0.md", [
              ("- [ ] Permanent read-only CI on final documentation head.\n- [ ] Minimum, previous stable and current stable Chrome package matrix.\n- [ ] Linux, Windows and macOS lifecycle matrix.\n- [ ] Zero unresolved review thread and zero open P0/P1.", "- [x] Permanent read-only CI on the final implementation head.\n- [x] Minimum, previous stable and current stable Chrome package matrix.\n- [x] Linux, Windows and macOS lifecycle matrix.\n- [x] Zero unresolved review thread and zero open P0/P1."),
              ("- [ ] Release-owner approval required for every publication action.", "- [x] Release-owner approval remains required before every publication action; no approval or publication is included in S26.")
          ])

          edit("docs/release/0.2.0.md", [
              ("Status: release candidate under final read-only validation", "Status: release candidate complete; ready for review"),
              ("- Implementation workflow: {{S26_RUN_EVIDENCE}}.\n- Reproducible package: {{S26_PACKAGE_EVIDENCE}}.\n- Permanent read-only CI and Release Candidate matrix: pending PR validation.", f"- Final validation: {runs}.\n- Reproducible package: {package}.\n- Compatibility: Linux/Windows/macOS lifecycle and {browsers} all pass.")
          ])
          PY

      - name: Format and verify documentation
        run: |
          pnpm format
          pnpm format:check
          git diff --check

      - name: Commit S26 closeout
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PLAN.md README.md CHANGELOG.md docs/audits/0.1.0-gap-audit.md docs/release/acceptance-criteria-0.2.0.md docs/release-checklist-0.2.0.md docs/release/0.2.0.md
          git commit -m "Complete S26 release-candidate documentation"
          git push origin HEAD:agent/s26-hardening-rc

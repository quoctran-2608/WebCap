name: Complete S19 Documentation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: s19-docs-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  complete-docs:
    if: github.head_ref == 'agent/s19-diagnostics-i18n-privacy'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out S19 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Verify and apply completion documentation
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < .s19-completion-docs.patch.gz.b64)" -eq 5632
          echo '9942765476066ac63cd325c0f8002735b967d67c55cfedfa9056153f521a1d55  .s19-completion-docs.patch.gz.b64' | sha256sum -c -
          base64 --decode .s19-completion-docs.patch.gz.b64 | gunzip > /tmp/s19-docs.patch
          test "$(wc -c < /tmp/s19-docs.patch)" -eq 10330
          echo '301c0762a9a301288b40f87a06bf853fbc9c427f02b5de34735dde79cfdb94c8  /tmp/s19-docs.patch' | sha256sum -c -
          git apply --check /tmp/s19-docs.patch
          git apply /tmp/s19-docs.patch
          git rm -f .s19-completion-docs.patch.gz.b64
          git rm -f .github/workflows/s19-complete-docs.yml
          git diff --check

      - name: Commit S19 completion documentation
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Complete S19 documentation'
          git push origin "HEAD:${GITHUB_HEAD_REF}"

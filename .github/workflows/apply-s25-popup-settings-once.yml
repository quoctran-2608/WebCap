name: Apply S25 popup settings once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apply-s25-popup-settings-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.head_ref == 'agent/s25-settings-events-popup'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out S25 branch
        uses: actions/checkout@v4
        with:
          ref: agent/s25-settings-events-popup
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Apply and format popup settings integration
        run: |
          python scripts/apply-s25-popup-settings.py
          pnpm exec prettier --write src/popup/App.tsx src/popup/capture-settings.ts src/popup/full-page-client.ts src/popup/settings-client.ts src/shared/constants.ts src/shared/popup-preferences.ts src/storage/popup-preferences-repository.ts src/storage/settings-repository.ts tests/unit/capture-settings.test.ts tests/unit/popup-preferences-repository.test.ts tests/unit/popup-settings-client.test.ts
          pnpm lint
          pnpm typecheck
          pnpm exec vitest run tests/unit/capture-settings.test.ts tests/unit/popup-preferences-repository.test.ts tests/unit/popup-settings-client.test.ts tests/unit/settings-repository.test.ts
      - name: Commit clean phase 2 candidate
        run: |
          git rm scripts/apply-s25-popup-settings.py .github/workflows/apply-s25-popup-settings-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src tests
          git commit -m "Apply stored settings across popup capture modes"
          git push origin HEAD:agent/s25-settings-events-popup

name: Format long PDF regression

on:
  push:
    branches:
      - agent/0.2.1-pdf-scroll-growth

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@v4
        with:
          ref: agent/0.2.1-pdf-scroll-growth

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format regression test
        run: pnpm exec prettier --write tests/unit/scroll-area-long-pdf.test.ts

      - name: Commit formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/scroll-area-long-pdf.test.ts
          git commit -m "Format long PDF regression test"
          git push origin HEAD:agent/0.2.1-pdf-scroll-growth

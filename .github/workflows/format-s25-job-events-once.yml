name: Format S25 job events once

on:
  push:
    branches:
      - agent/s25-settings-events-popup

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/s25-settings-events-popup
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format target
        run: pnpm exec prettier --write tests/unit/job-events-client.test.ts
      - name: Remove one-shot workflow
        run: rm .github/workflows/format-s25-job-events-once.yml
      - name: Commit formatted file
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/unit/job-events-client.test.ts .github/workflows/format-s25-job-events-once.yml
          git commit -m "Format job events client test"
          git push origin HEAD:agent/s25-settings-events-popup

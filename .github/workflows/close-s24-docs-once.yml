name: Close S24 documentation once

on:
  push:
    branches:
      - agent/s24-auto-output
    paths:
      - .github/workflows/close-s24-docs-once.yml

permissions:
  contents: write

jobs:
  document:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/s24-auto-output
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Update milestone documents
        run: |
          python - <<'PY'
          from pathlib import Path

          plan_path = Path("PLAN.md")
          plan = plan_path.read_text()
          replacements = {
              "date: 2026-08-04\n": "date: 2026-08-05\n",
              "current_session: S24\n": "current_session: S25\n",
              "S21–S23 đã hoàn tất reset lifecycle, region selector đáng tin cậy và adaptive auto-scroll có resumable frontier mà không thay manifest, package version hoặc artifact 0.1.0. S24 là session active tiếp theo.": "S21–S24 đã hoàn tất reset lifecycle, region selector đáng tin cậy, adaptive auto-scroll có resumable frontier và mode-aware output mà không thay manifest, package version hoặc artifact 0.1.0. S25 là session active tiếp theo.",
              "| S24 | Auto-PDF và mode-aware image/PDF output | PLANNED | S23 |": "| S24 | Auto-PDF và mode-aware image/PDF output | DONE | S23 |",
              "| S25 | Stored settings, event-driven progress và simplified popup | BLOCKED | S21–S24 stable contracts |": "| S25 | Stored settings, event-driven progress và simplified popup | PLANNED | S21–S24 stable contracts |",
          }
          for old, new in replacements.items():
              if old not in plan:
                  raise SystemExit(f"Missing PLAN marker: {old}")
              plan = plan.replace(old, new, 1)

          evidence = """

## S24 implementation evidence

- `CaptureCompletionPolicy` routes full-page and scroll-area jobs to automatic PDF export, region and element jobs to guarded image export, and leaves visible capture on its existing image flow.
- Auto-export begins only from the durable `ready` checkpoint. Output format, artifact ID, MIME type, byte length and PDF page count persist on the job; worker recovery reconciles an existing output before starting work again.
- `TiledImageExportService` validates dimensions, total pixel area and working-set budget before allocating an `OffscreenCanvas`, decodes tiles sequentially and emits PNG/JPEG/WebP without a full-page canvas.
- `E_IMAGE_OUTPUT_TOO_LARGE` preserves every source tile and exposes the explicit “Chuyển sang PDF không chụp lại” action. Browser coverage proves the same job and exact stored tile Blobs produce the fallback PDF without reopening a selector or recapturing pixels.
- Reopening the popup restores the most recent terminal output when no active job exists. Result cards expose the correct image/PDF metadata, download, supported edit and new-capture actions.
- Editing an auto-generated PDF explicitly reopens `completed → ready`, removes only the old output artifact, keeps source tiles and edit manifest consistency, then produces a replacement PDF without recapture.
- Partial capture is never auto-exported until the user explicitly keeps the contiguous prefix; cancellation/reset continue to discard capture-owned data.
- Final clean gate on commit `6d23173f0bebf8bc6ffd23327dacd7fb58322d47`: formatting, ESLint, strict TypeScript, privacy/dependency/release/critical-security audits, 325/325 unit tests on 92 files, 4/4 PDF benchmarks, verified Manifest V3 build, reproducible 24-entry ZIP, 49/49 Playwright E2E and packaged install/update/uninstall lifecycle all PASS.

## S24 exit disposition

- AC-22: PASS — successful full-page capture starts PDF export without opening the editor.
- AC-23: PASS — PDF remains page-at-a-time with decoded-tile concurrency bounded to one and no full-page canvas.
- AC-24: PASS — export failure preserves source tiles; retry and image-to-PDF fallback reuse them without recapture.
- AC-36: PASS — full-page/scroll-area default to PDF, region/element return direct guarded images and oversized images receive an explicit PDF fallback.
- S25 is unblocked and becomes the active session; stored settings, event-driven progress and simplified popup remain out of S24 scope.
"""
          marker = "\n# 9. S25 — Settings, events và simplified popup"
          if "## S24 implementation evidence" in plan:
              raise SystemExit("S24 evidence already exists")
          if marker not in plan:
              raise SystemExit("Missing S25 PLAN marker")
          plan = plan.replace(marker, evidence + marker, 1)
          plan_path.write_text(plan)

          spec_path = Path("docs/spec-0.2.0.md")
          spec = spec_path.read_text()
          if "date: 2026-08-04\n" not in spec:
              raise SystemExit("Missing spec date marker")
          spec = spec.replace("date: 2026-08-04\n", "date: 2026-08-05\n", 1)
          spec_section = """

## 5.4 Locked S24 implementation semantics

- Completion routing is deterministic by mode: full-page and scroll-area automatically request PDF; region and element automatically request the validated image format; visible capture keeps its existing artifact flow.
- `ready` is the durable handoff from capture to output. Completion recovery first reconciles `outputArtifactId` and the persisted artifact, so service-worker restart cannot create a second output for the same completed attempt.
- Terminal lookup prefers an active job, otherwise the newest durable terminal summary for the tab. Closing and reopening the popup therefore restores completed PNG/PDF result metadata without loading tile Blobs into session storage.
- Tiled image composition is allowed only after dimension, pixel-area and estimated working-set guards. Tiles decode and close sequentially; unsafe canvas allocation returns typed `E_IMAGE_OUTPUT_TOO_LARGE` with `fallbackAllowed: true`.
- The oversized-image fallback is user initiated. It invokes PDF export on the same failed job and stored tiles, does not reopen a selector and does not recapture pixels.
- Auto-generated PDF output remains editable. The first explicit editor mutation reopens `completed → ready`, deletes only the old PDF artifact/output link, keeps source tiles, and rolls the manifest back if reopening fails.
- Output metadata includes artifact ID, format, MIME type, byte length and PDF page count. Download, supported Edit and New capture actions derive from this durable contract.
- Guard-limited partial capture requires explicit keep confirmation before output starts.
- S24 acceptance evidence: 325 unit tests, four bounded PDF benchmarks, 49 actual-browser E2E cases including image-too-large PDF fallback without recapture, reproducible packaging and packaged lifecycle smoke.
"""
          spec_marker = "\n# 6. Reset domain command"
          if "## 5.4 Locked S24 implementation semantics" in spec:
              raise SystemExit("S24 spec semantics already exist")
          if spec_marker not in spec:
              raise SystemExit("Missing spec reset marker")
          spec = spec.replace(spec_marker, spec_section + spec_marker, 1)
          spec_path.write_text(spec)

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text()
          changelog_marker = "## [Unreleased]\n\n### Added\n\n"
          if changelog_marker not in changelog:
              raise SystemExit("Missing changelog marker")
          additions = """- Mode-aware completion routing that automatically creates PDF for full-page and scroll-area captures, returns guarded PNG/JPEG/WebP for region and element captures, and preserves the existing visible-image flow.
- Durable output metadata and terminal-job restoration across popup reopen and Manifest V3 service-worker restart, with existing artifact reconciliation preventing duplicate output creation.
- Guarded sequential tiled-image composition with canvas dimension, total pixel-area and estimated working-set limits before allocation.
- Explicit `E_IMAGE_OUTPUT_TOO_LARGE` PDF fallback that reuses the same job and exact stored tile Blobs without selector reopen or pixel recapture.
- Editable auto-generated PDFs: an explicit edit reopens `completed` output safely, removes only the old PDF artifact and preserves source tiles for replacement export.
- S24 browser coverage for automatic PDF/image result cards, popup lifecycle recovery, editor re-export, and oversized-image fallback; the clean gate passes 325 unit tests across 92 files, four PDF benchmarks, 49 Playwright E2E cases and packaged lifecycle smoke.
"""
          if "Mode-aware completion routing that automatically creates PDF" in changelog:
              raise SystemExit("S24 changelog entries already exist")
          changelog = changelog.replace(changelog_marker, changelog_marker + additions, 1)
          changelog_path.write_text(changelog)
          PY
          pnpm exec prettier --write PLAN.md docs/spec-0.2.0.md CHANGELOG.md
          rm .github/workflows/close-s24-docs-once.yml
      - name: Commit milestone documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PLAN.md docs/spec-0.2.0.md CHANGELOG.md .github/workflows/close-s24-docs-once.yml
          git commit -m "docs: close S24 output milestone"
          git push origin HEAD:agent/s24-auto-output

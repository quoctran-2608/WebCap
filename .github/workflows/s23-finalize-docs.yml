name: S23 Finalize Documentation

on:
  push:
    branches: [agent/s23-adaptive-scroll]

permissions:
  contents: write

concurrency:
  group: s23-finalize-docs
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out S23 branch
        uses: actions/checkout@v4
        with:
          ref: agent/s23-adaptive-scroll
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Finalize S23 plan, spec, status and changelog
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected one anchor, found {count}: {old!r}')
              file.write_text(text.replace(old, new))

          replace_once('PLAN.md', 'current_session: S23', 'current_session: S24')
          replace_once(
              'PLAN.md',
              'S21–S22 đã hoàn tất reset lifecycle và region selector đáng tin cậy mà không thay manifest, package version hoặc artifact 0.1.0. S23 là session active tiếp theo.',
              'S21–S23 đã hoàn tất reset lifecycle, region selector đáng tin cậy và adaptive auto-scroll có resumable frontier mà không thay manifest, package version hoặc artifact 0.1.0. S24 là session active tiếp theo.',
          )
          replace_once(
              'PLAN.md',
              '| S23 | Adaptive auto-scroll và resumable frontier | PLANNED | S21–S22 |\n| S24 | Auto-PDF và mode-aware image/PDF output | BLOCKED | S23 |',
              '| S23 | Adaptive auto-scroll và resumable frontier | DONE | S21–S22 |\n| S24 | Auto-PDF và mode-aware image/PDF output | PLANNED | S23 |',
          )
          replace_once(
              'PLAN.md',
              '''## Exit\n\n- AC-19–AC-21 và AC-38 pass.\n- Không silent truncation.\n- Không full-page canvas/multi-tile decode.\n\n# 8. S24 — Auto-PDF và mode-aware output''',
              '''## Exit\n\n- AC-19–AC-21 và AC-38 pass.\n- Không silent truncation.\n- Không full-page canvas/multi-tile decode.\n\n## S23 implementation evidence\n\n- Full-page jobs created by the 0.2 flow route to an incremental adaptive scroll engine; region and element retain the deterministic coordinator.\n- The persisted frontier advances only after a complete row has durable tile Blobs. A partially stored row resumes only missing columns and is rolled back before any guard-limited partial result is exposed.\n- Finite document growth is expected. Completion requires bottom reach, three stable rounds and a final probe; pages beyond 100,000 CSS pixels no longer stop at the legacy height cap.\n- Duration, tile, byte-budget and storage failures preserve a rectangular contiguous prefix with an explicit partial reason.\n- Document token, width, viewport and DPR guards prevent tiles from different page identities from being joined.\n- Service-worker restart recovery reuses the durable prefix and re-prepares the same page. Cached page-preparation responses are re-enveloped with the current transport request ID to keep idempotency protocol-safe.\n- Final clean gate: formatting, ESLint, strict TypeScript, privacy/dependency/release/critical-security audits, 306/306 unit tests on 88 files, 4/4 PDF benchmarks, verified build, reproducible ZIP, 48/48 Playwright E2E and packaged lifecycle smoke all PASS.\n\n## Exit disposition\n\n- AC-19, AC-20, AC-21 and AC-38: PASS.\n- No arbitrary 100,000 CSS-pixel adaptive stop and no silent complete status for resource-limited output.\n- PDF/output routing remains intentionally deferred to S24.\n\n# 8. S24 — Auto-PDF và mode-aware output''',
          )

          replace_once(
              'docs/spec-0.2.0.md',
              'status: Approved for implementation planning',
              'status: Active implementation specification',
          )
          replace_once(
              'docs/spec-0.2.0.md',
              '# 5. Auto-PDF và mode-aware output',
              '''## 4.6 Locked S23 implementation semantics\n\n- Adaptive planning is row-incremental. The frontier is persisted after a complete durable row, not merely after a screenshot is requested.\n- A pending row may contain stored columns after interruption; resume skips those columns, completes the row and only then advances `capturedBottomCss`/`nextYCss`.\n- The adaptive target height grows monotonically. Width, viewport, DPR, pixel-scale or document-token drift fails safely; document shrink below the observed frontier is not accepted.\n- Natural completion requires three stable bottom rounds and a final probe. The legacy `100_000` CSS-height preparation limit is not an adaptive capture stop.\n- Guard exits return a rectangular contiguous prefix with `max-duration`, `max-tiles`, `max-stored-bytes` or `storage-pressure`; an incomplete row is removed before partial settlement.\n- Startup recovery restores the exact tab lease and resumes eligible full-page scroll jobs. Idempotent content preparation reuses its cached payload but binds the response envelope to the current request ID, avoiding stale-worker `RequestIdMismatch`.\n- S23 acceptance evidence is 306 unit tests, four PDF benchmarks, 48 actual-browser E2E cases including >100k/lazy/infinite/restart fixtures, a reproducible build and packaged lifecycle smoke.\n\n# 5. Auto-PDF và mode-aware output''',
          )

          replace_once(
              'README.md',
              '**0.2.0 implementation is active. S21 capture reset and S22 region-selector reliability are complete; S23 adaptive auto-scroll is next.** S21 adds a versioned reset domain command, owned-data cleanup, active-task quiescence, late-output protection and a visible “New capture” action. S22 adds a focused ready handshake, pointer/keyboard region editing, two-axis auto-scroll, 24 CSS-pixel handles, duplicate-open safety and zero-orphan launch cleanup. S23–S26 remain planned for resumable adaptive capture, mode-aware output, settings/events/UI and release hardening. “Capture to the end” removes the arbitrary 100,000 CSS-pixel stopping behavior for adaptive mode while retaining explicit time, storage, tile and memory safeguards for truly infinite or device-exhausting pages.',
              '**0.2.0 implementation is active. S21 capture reset, S22 region-selector reliability and S23 adaptive auto-scroll are complete; S24 auto-PDF/output routing is next.** S23 captures finite pages beyond the legacy 100,000 CSS-pixel cap, follows bounded lazy growth to a stable end, persists a row-safe resumable frontier and returns explicit contiguous partial output at resource guards. Service-worker restart recovery reuses stored tiles without recapturing the prefix, while document identity/geometry guards prevent cross-page stitching. S24–S26 remain planned for automatic PDF and mode-aware output, settings/events/UI, and release hardening.',
          )

          changelog_anchor = '- Selector removal plus two animation frames before capture, duplicate-open instance reuse, DPR/zoom coordinate coverage, and browser validation for overlay exclusion and exact page restoration.\n'
          changelog_add = changelog_anchor + '''- Adaptive full-page scroll capture with incremental row planning, stable-bottom detection, finite lazy-growth support and no arbitrary 100,000 CSS-pixel stopping cap.\n- Durable resumable frontier that advances only after complete stored rows, resumes missing columns after interruption and preserves a rectangular contiguous prefix at time, tile, byte or storage guards.\n- Source document, width, viewport and DPR revalidation plus service-worker restart recovery that does not recapture stored prefix rows.\n- Idempotent page-preparation response re-enveloping so a restarted worker can reuse an existing prepared page without stale request-ID protocol failure.\n- S23 browser fixtures for >100k pages, finite lazy growth, infinite-feed partial output and real service-worker target restart; the clean gate passes 306 unit tests across 88 files, four PDF benchmarks, 48 Playwright E2E cases and packaged lifecycle smoke.\n'''
          replace_once('CHANGELOG.md', changelog_anchor, changelog_add)

          Path('docs/sessions/s23-adaptive-scroll.md').write_text('''# S23 — Adaptive auto-scroll and resumable frontier\n\nStatus: DONE\nTarget release: WebCap 0.2.0\nCompleted: 2026-08-05\n\n## Delivered\n\n- Incremental full-page row planning without a fixed 100,000 CSS-pixel capture stop.\n- Persisted adaptive frontier advanced only after every tile in a row is durably stored.\n- Resume of complete prefix rows and partially stored rows without recapturing stored columns.\n- Source-document token plus document-width, viewport-size and DPR identity guards.\n- Finite height growth as expected behavior; shrink, navigation or geometry drift fails safely.\n- Three stable-bottom rounds plus a final probe before natural completion.\n- Explicit duration, tile, byte-budget and storage partial-stop reasons.\n- Incomplete-row rollback so retained output remains rectangular and continuous.\n- Mode-aware coordination: full-page uses adaptive scroll while region and element retain the deterministic coordinator.\n- Startup recovery after service-worker restart.\n- Idempotent page-preparation responses re-enveloped with the current request ID.\n\n## Locked safety invariants\n\n- Frontier never advances before a complete stored row.\n- Stored prefix rows are immutable and are not recaptured after growth or restart.\n- A partially stored row is never exposed as completed partial output.\n- Navigation, width, viewport or DPR drift cannot join tiles from different page identities.\n- Infinite or device-exhausting pages end with an explicit partial reason, not silent truncation.\n- Cleanup restores the source page and releases exact lifecycle ownership.\n- Cached preparation payloads never reuse stale transport request IDs.\n\n## Final evidence\n\n- Formatting, ESLint, strict TypeScript, privacy/dependency/release/critical-security audits: PASS.\n- Unit: 306/306 tests on 88 files.\n- PDF performance reference: 4/4 scenarios PASS.\n- Production Manifest V3 build and two-run reproducible ZIP: PASS.\n- Reproducible ZIP: 1,157,200 bytes, SHA-256 `71abe04631a22d8fdebcf7b8ddfecce8475a22290a8c366ae10e04aa01cf82be`.\n- Actual-browser regression: 48/48 Playwright E2E PASS in 5.8 minutes.\n- Adaptive acceptance includes >100k CSS pixels, finite lazy growth, infinite max-tile partial and persisted-prefix recovery after a real extension service-worker target restart.\n- Release DPR/zoom matrix and region/element/scroll-area/visible/PDF regressions: PASS.\n- Packaged lifecycle on Chrome for Testing 151: clean install, simulated 0.0.9 → 0.1.0 update, stable extension ID, local storage retention and uninstall verification PASS.\n- No package/manifest version or permission change; the 0.1.0 artifact boundary remains intact.\n\n## Deferred by scope\n\nAutomatic PDF creation and mode-aware output routing remain S24. Stored-settings application, event-driven progress and popup information architecture remain S25.\n''')
          PY
          rm .github/workflows/s23-finalize-docs.yml
          pnpm exec prettier --write PLAN.md docs/spec-0.2.0.md README.md CHANGELOG.md docs/sessions/s23-adaptive-scroll.md

      - name: Validate documentation formatting
        run: pnpm format:check

      - name: Commit clean S23 closeout
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add PLAN.md docs/spec-0.2.0.md README.md CHANGELOG.md docs/sessions/s23-adaptive-scroll.md .github/workflows/s23-finalize-docs.yml
          git commit -m "Finalize S23 milestone evidence"
          git push origin HEAD:agent/s23-adaptive-scroll

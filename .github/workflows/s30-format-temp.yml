name: S30 temporary formatter

on:
  push:
    branches: [agent/s30-viewer-intelligence-v2]

permissions:
  contents: write

concurrency:
  group: s30-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/s30-viewer-intelligence-v2

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format S30 content-discovery files
        run: >-
          pnpm exec prettier --write
          src/content/pdf-viewer-discovery-runtime.ts
          src/content/pdf-viewer-discovery.ts
          src/shared/contracts/pdf-viewer-discovery.ts

      - name: Commit canonical formatting
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/pdf-viewer-discovery-runtime.ts src/content/pdf-viewer-discovery.ts src/shared/contracts/pdf-viewer-discovery.ts
          git commit -m "Format S30 content discovery files"
          git push origin HEAD:agent/s30-viewer-intelligence-v2

# Trigger after workflow registration.

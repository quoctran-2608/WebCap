name: S30 canonical formatter

on:
  push:
    branches: [agent/s30-viewer-intelligence-v2]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/s30-viewer-intelligence-v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/content/pdf-viewer-discovery.ts
      - name: Commit canonical formatting
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/pdf-viewer-discovery.ts
          git commit -m "style(s30): apply canonical prettier formatting"
          git push origin HEAD:agent/s30-viewer-intelligence-v2

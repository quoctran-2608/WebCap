name: S30 temporary content runtime patch

on:
  push:
    branches: [agent/s30-viewer-intelligence-v2]

permissions:
  contents: write

concurrency:
  group: s30-content-runtime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/s30-viewer-intelligence-v2

      - name: Patch content entry
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('node:fs');
          const path = 'src/content/entry.ts';
          let source = fs.readFileSync(path, 'utf8');
          const importNeedle = 'import { openRegionSelector, type RegionSelectorController } from "./region-selector";\n';
          const importReplacement = `${importNeedle}import { installPdfViewerDiscoveryRuntime } from "./pdf-viewer-discovery-runtime";\n`;
          if (!source.includes('installPdfViewerDiscoveryRuntime')) {
            if (!source.includes(importNeedle)) throw new Error('S30 import insertion point not found.');
            source = source.replace(importNeedle, importReplacement);
          }
          const bottomNeedle = `if (typeof chrome !== "undefined" && typeof document !== "undefined") {\n  registerPagePreparationContentScript();\n  installElementSelectionRuntime();\n}\n`;
          const bottomReplacement = `if (typeof chrome !== "undefined" && typeof document !== "undefined") {\n  registerPagePreparationContentScript();\n  installElementSelectionRuntime();\n  installPdfViewerDiscoveryRuntime();\n}\n`;
          if (!source.includes('  installPdfViewerDiscoveryRuntime();')) {
            if (!source.includes(bottomNeedle)) throw new Error('S30 runtime insertion point not found.');
            source = source.replace(bottomNeedle, bottomReplacement);
          }
          fs.writeFileSync(path, source);
          NODE

      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/content/entry.ts
          git commit -m "Wire S30 discovery into content runtime"
          git push origin HEAD:agent/s30-viewer-intelligence-v2

name: S24 Router Apply

on:
  push:
    branches:
      - agent/s24-auto-output

permissions:
  contents: write

concurrency:
  group: s24-router-apply
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out S24 branch
        uses: actions/checkout@v4
        with:
          ref: agent/s24-auto-output
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate and format integration
        shell: bash
        run: |
          set +e
          node scripts/generate-s24-router-integration.mjs
          status=$?
          set -e
          if [ "$status" -ne 1 ]; then
            echo "Unexpected generator exit status: $status" >&2
            exit 1
          fi

      - name: Remove temporary integration machinery
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from "node:fs";
          const path = "package.json";
          const packageJson = JSON.parse(readFileSync(path, "utf8"));
          packageJson.scripts["format:check"] = "prettier --check .";
          writeFileSync(path, `${JSON.stringify(packageJson, null, 2)}\n`);
          NODE
          rm -rf artifacts/s24-router
          rm scripts/generate-s24-router-integration.mjs
          rm .github/workflows/s24-router-apply.yml
          pnpm exec prettier --write package.json

      - name: Validate generated scope
        shell: bash
        run: |
          git diff --check
          git status --short
          test ! -e scripts/generate-s24-router-integration.mjs
          test ! -e .github/workflows/s24-router-apply.yml
          grep -F '"format:check": "prettier --check ."' package.json

      - name: Commit clean integration
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Integrate S24 automatic output routing"
          git push origin HEAD:agent/s24-auto-output

name: Validate PDF scroll stability hotfix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: pdf-scroll-stability-hotfix
  cancel-in-progress: true

jobs:
  validate:
    if: github.event.pull_request.head.ref == 'agent/0.2.2-pdf-scroll-stability-hotfix'
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Check out hotfix branch
        uses: actions/checkout@v4
        with:
          ref: agent/0.2.2-pdf-scroll-stability-hotfix
          fetch-depth: 0

      - name: Record running evidence
        env:
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          printf '{\n  "runId": %s,\n  "sourceSha": "%s",\n  "status": "running"\n}\n' "$RUN_ID" "$SOURCE_SHA" > .github/pdf-stability-validation.json
          git config user.name "webcap-agent"
          git config user.email "webcap-agent@users.noreply.github.com"
          git add .github/pdf-stability-validation.json
          git commit -m "Record PDF stability validation start"
          git push origin HEAD:agent/0.2.2-pdf-scroll-stability-hotfix

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Privacy, dependency, and release audit
        run: pnpm run audit

      - name: Critical dependency audit
        run: pnpm audit:security

      - name: Unit tests
        run: pnpm test:unit

      - name: PDF performance benchmark
        run: pnpm benchmark:pdf

      - name: Build extension
        run: pnpm build

      - name: Reproduce and verify release ZIP
        run: node scripts/verify-reproducible-package.mjs

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Full extension E2E
        run: pnpm test:e2e

      - name: Packaged lifecycle smoke
        run: pnpm test:release

      - name: Upload release candidate evidence
        uses: actions/upload-artifact@v4
        with:
          name: webcap-pdf-stability-hotfix-${{ github.event.pull_request.head.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-pdf-stability-${{ github.event.pull_request.head.sha }}
          path: playwright-report/
          if-no-files-found: error
          retention-days: 7

      - name: Record passing evidence
        env:
          RUN_ID: ${{ github.run_id }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          ZIP=artifacts/webcap-0.2.0.zip
          HASH=$(sha256sum "$ZIP" | awk '{print $1}')
          BYTES=$(stat -c%s "$ZIP")
          ENTRIES=$(unzip -Z1 "$ZIP" | wc -l | tr -d ' ')
          printf '{\n  "runId": %s,\n  "sourceSha": "%s",\n  "zip": "webcap-0.2.0.zip",\n  "sha256": "%s",\n  "bytes": %s,\n  "entries": %s,\n  "status": "pass"\n}\n' "$RUN_ID" "$SOURCE_SHA" "$HASH" "$BYTES" "$ENTRIES" > .github/pdf-stability-validation.json
          git add .github/pdf-stability-validation.json
          git commit -m "Record PDF stability validation evidence"
          git push origin HEAD:agent/0.2.2-pdf-scroll-stability-hotfix

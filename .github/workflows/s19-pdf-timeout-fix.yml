name: Apply S19 PDF E2E Timeout Fix

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: s19-pdf-timeout-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply:
    if: github.head_ref == 'agent/s19-diagnostics-i18n-privacy'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out S19 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Verify and apply focused timeout patch
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < .s19-pdf-timeout.patch.b64)" -eq 1200
          echo 'beb111cc581cf0e6c888476f591a0be817e5a92cf0929e01e90c59d75aa17dea  .s19-pdf-timeout.patch.b64' | sha256sum -c -
          base64 --decode .s19-pdf-timeout.patch.b64 > /tmp/s19-pdf-timeout.patch
          test "$(wc -c < /tmp/s19-pdf-timeout.patch)" -eq 898
          echo '58498af2902cb4be545ebf16184133b5e339d08aa1f5cd6de780dcf62289dc55  /tmp/s19-pdf-timeout.patch' | sha256sum -c -
          git apply --check /tmp/s19-pdf-timeout.patch
          git apply /tmp/s19-pdf-timeout.patch
          git rm -f .s19-pdf-timeout.patch.b64
          git rm -f .github/workflows/s19-pdf-timeout-fix.yml
          git diff --check

      - name: Commit focused test reliability fix
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Give PDF editor E2E sufficient CI budget'
          git push origin "HEAD:${GITHUB_HEAD_REF}"

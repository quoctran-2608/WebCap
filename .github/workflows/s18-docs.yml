name: Complete S18 Documentation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: s18-docs-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  complete-docs:
    if: github.head_ref == 'agent/s18-capture-hardening'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out S18 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Verify and apply documentation patch
        shell: bash
        run: |
          set -euo pipefail

          expected=(
            'e32610b9bde2d902820a1a7e12cfd7b3a990b6dacd924db213bbe1d7841b20a8  .s18-docs.patch.part00'
            '406772024f91b0993a969eda5f1818db6002c4a369e0300930c3178c55f9a94c  .s18-docs.patch.part01'
          )
          printf '%s\n' "${expected[@]}" | sha256sum -c -

          cat .s18-docs.patch.part{00..01} > /tmp/s18-docs.patch.gz.b64
          test "$(wc -c < /tmp/s18-docs.patch.gz.b64)" -eq 7520
          echo '312561c812fb79017fa475122f97e148096cf606f5c8ea8b044816926397bdee  /tmp/s18-docs.patch.gz.b64' | sha256sum -c -

          base64 --decode /tmp/s18-docs.patch.gz.b64 | gunzip > /tmp/s18-docs.patch
          test "$(wc -c < /tmp/s18-docs.patch)" -eq 14584
          echo '186979d3c6786f2d62321b698a4eae2e32286740315e80593ec19a9bcde588dc  /tmp/s18-docs.patch' | sha256sum -c -
          git apply --check /tmp/s18-docs.patch
          git apply /tmp/s18-docs.patch

          git rm -f .s18-docs.patch.part{00..01}
          git rm -f .github/workflows/s18-docs.yml
          git diff --check

      - name: Commit S18 completion documentation
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Complete S18 documentation'
          git push origin "HEAD:${GITHUB_HEAD_REF}"

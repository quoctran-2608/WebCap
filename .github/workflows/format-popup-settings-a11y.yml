name: Format popup settings accessibility test

on:
  push:
    branches:
      - agent/s25-settings-events-popup

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/s25-settings-events-popup
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format test and remove workflow
        run: |
          pnpm exec prettier --write tests/e2e/popup-settings-accessibility.spec.ts
          rm .github/workflows/format-popup-settings-a11y.yml

      - name: Commit formatted output
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/popup-settings-accessibility.spec.ts .github/workflows/format-popup-settings-a11y.yml
          git commit -m "Format settings accessibility test"
          git push origin HEAD:agent/s25-settings-events-popup

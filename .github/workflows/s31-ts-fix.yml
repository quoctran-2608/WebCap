name: S31 focused TypeScript fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/s31-page-native-capture-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/s31-page-native-capture-v2
      - name: Apply exact optional property fix
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/capture/page-native-capture-engine.ts")
          text = path.read_text()
          old = '''          tileIndex: capturedPageTiles.at(-1)?.index,
          '''
          new = '''          ...(capturedPageTiles.at(-1)?.index === undefined
            ? {}
            : { tileIndex: capturedPageTiles.at(-1)?.index }),
          '''
          if old not in text:
              raise SystemExit("S31 TypeScript patch anchor missing")
          path.write_text(text.replace(old, new, 1))
          PY
          git rm .github/workflows/s31-ts-fix.yml
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/capture/page-native-capture-engine.ts
      - name: Commit focused fix and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Fix S31 exact optional progress typing"
          git push origin HEAD:agent/s31-page-native-capture-v2

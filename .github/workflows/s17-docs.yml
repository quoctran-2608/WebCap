name: Complete S17 Documentation

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: s17-docs-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  complete-docs:
    if: github.head_ref == 'agent/s17-pdf-source-passthrough'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out S17 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Verify and apply documentation patch
        shell: bash
        run: |
          set -euo pipefail
          echo '66438828226f345f9497345eaf82741e914452fec070b051fc814afbc2a4fa14  .s17-docs.patch.gz.b64' | sha256sum -c -
          base64 --decode .s17-docs.patch.gz.b64 | gunzip > /tmp/s17-docs.patch
          echo '0e050545bf33ea0584110c60ee9aadb954cb92c927f3d34a33e0b826d82ded11  /tmp/s17-docs.patch' | sha256sum -c -
          git apply --check /tmp/s17-docs.patch
          git apply /tmp/s17-docs.patch
          git rm -f .s17-docs.patch.gz.b64 .github/workflows/s17-docs.yml
          git diff --check

      - name: Commit S17 completion documentation
        shell: bash
        run: |
          set -euo pipefail
          git add -A
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Complete S17 documentation'
          git push origin "HEAD:${GITHUB_HEAD_REF}"

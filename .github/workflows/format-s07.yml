name: Format S07

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out S07 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format S07 files
        run: |
          pnpm exec prettier --write \
            src/background/debugger-client.ts \
            src/capture/cdp-measurement-service.ts \
            src/capture/page-metrics.ts \
            src/capture/tile-planner.ts \
            tests/unit/cdp-measurement-service.test.ts \
            tests/unit/debugger-client.test.ts \
            tests/unit/tile-planner.test.ts
          pnpm format:check

      - name: Commit formatted S07 files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/background/debugger-client.ts src/capture tests/unit/cdp-measurement-service.test.ts tests/unit/debugger-client.test.ts tests/unit/tile-planner.test.ts
          git diff --cached --check
          git commit -m "Format S07 implementation"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

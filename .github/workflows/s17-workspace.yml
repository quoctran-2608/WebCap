name: Apply and Validate S17

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

concurrency:
  group: s17-apply-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-and-validate:
    if: github.head_ref == 'agent/s17-pdf-source-passthrough'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out S17 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify and apply S17 patch
        shell: bash
        run: |
          set -euo pipefail

          expected=(
            'cf118b43c9a5061f956071b961d10bcc6e526f3669c95d0fd7cdb031b5bc02d4  .s17-core-v3.patch.part00'
            'e750fc38a3c4d574c357c5a57c389f32bae35d8a2f64109ad6096b57964752d2  .s17-core-v3.patch.part01'
            '9b22965822d2fbb1205b3e072f99bfd7fcfc023aef4b70b32d6cef39a67e6bf0  .s17-core-v3.patch.part02'
            'f67e63c21c9f5ad803a019dfc384a6729f76a2ce3f89059d3fddd7e8b2b16af6  .s17-core-v3.patch.part03'
            '2a7c7799b274f3a9237f31a5628baadae59003169d266cb55bf37294a63c7942  .s17-core-v3.patch.part04'
            'e7e93d011e8914a08f8f9c6fb6c46565a9b886fdbe4772505ef9e5f650521661  .s17-core-v3.patch.part05'
            'c2260b5bf82a931a7ff066a4097408e1c9f4b0159188f87f88bed662b8c92295  .s17-core-v3.patch.part06'
          )
          printf '%s\n' "${expected[@]}" | sha256sum -c -

          cat .s17-core-v3.patch.part{00..06} > /tmp/s17-core.patch.gz.b64
          test "$(wc -c < /tmp/s17-core.patch.gz.b64)" -eq 24316
          echo '42ba61d2c3309718753233e2a44b20ac522ffdfc2e9f8df4a1bf05ab5581b76b  /tmp/s17-core.patch.gz.b64' | sha256sum -c -

          base64 --decode /tmp/s17-core.patch.gz.b64 | gunzip > /tmp/s17-core.patch
          echo '68e0ae6b0e4e1a1c48043b46de2b5b938cb5a44cec94cdfafce6900334ab199e  /tmp/s17-core.patch' | sha256sum -c -
          git apply --check /tmp/s17-core.patch
          git apply /tmp/s17-core.patch

          git rm -f \
            .s17-core.patch.gz.b64 \
            .s17-core.patch.part{00..06} \
            .s17-core-v2.patch.part{00..03} \
            .s17-core-v3.patch.part{00..06}
          git rm -f .github/workflows/s17-workspace.yml

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: PDF performance benchmark
        run: pnpm benchmark:pdf

      - name: Build extension
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Extension E2E
        run: pnpm test:e2e

      - name: Commit validated S17 implementation
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist playwright-report test-results
          git add -A
          git diff --cached --check
          git status --short
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Add PDF source passthrough'
          git push origin "HEAD:${GITHUB_HEAD_REF}"

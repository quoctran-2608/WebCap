name: S17 Workspace Snapshot

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]

permissions:
  contents: read

concurrency:
  group: s17-workspace-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  workspace:
    if: github.head_ref == 'agent/s17-pdf-source-passthrough'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out S17 branch
        uses: actions/checkout@v4

      - name: Install pinned pnpm
        run: |
          corepack enable
          corepack install --global pnpm@11.15.1
          node --version
          pnpm --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Package workspace
        run: |
          tar \
            --exclude=.git \
            --exclude=dist \
            --exclude=playwright-report \
            --exclude=test-results \
            -czf /tmp/webcap-s17-workspace.tgz .

      - name: Upload workspace
        uses: actions/upload-artifact@v4
        with:
          name: webcap-s17-workspace
          path: /tmp/webcap-s17-workspace.tgz
          retention-days: 1

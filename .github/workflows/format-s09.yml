name: Format S09

on:
  push:
    branches:
      - agent/s09-cdp-full-page-capture

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out S09 branch
        uses: actions/checkout@v4
        with:
          ref: agent/s09-cdp-full-page-capture

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format S09 changes and remove helper workflow
        run: |
          pnpm exec prettier --write \
            src/background/full-page-capture-coordinator.ts \
            src/background/persistent-job-router.ts \
            src/capture/cdp-capture-engine.ts \
            src/popup/App.tsx \
            src/popup/full-page-client.ts \
            tests/e2e/full-page-capture.spec.ts \
            tests/unit/cdp-capture-engine.test.ts \
            tests/unit/full-page-capture-coordinator.test.ts \
            tests/unit/persistent-job-router.test.ts
          rm .github/workflows/format-s09.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format S09 full-page capture changes"
          git push origin HEAD:agent/s09-cdp-full-page-capture

name: Format S24 fallback test once

on:
  push:
    branches:
      - agent/s24-auto-output
    paths:
      - tests/e2e/image-output-fallback.spec.ts
      - .github/workflows/format-s24-fallback-once.yml

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: agent/s24-auto-output
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format and clean up
        run: |
          pnpm exec prettier --write tests/e2e/image-output-fallback.spec.ts
          rm .github/workflows/format-s24-fallback-once.yml
      - name: Commit formatted test
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/image-output-fallback.spec.ts .github/workflows/format-s24-fallback-once.yml
          git commit -m "test(e2e): format oversized image fallback coverage"
          git push origin HEAD:agent/s24-auto-output

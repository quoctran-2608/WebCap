name: Apply PDF scroll stability hotfix

on:
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  apply:
    if: github.event.pull_request.head.ref == 'agent/0.2.2-pdf-scroll-stability-hotfix'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/0.2.2-pdf-scroll-stability-hotfix
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: node scripts/apply-pdf-scroll-stability-hotfix.mjs
      - run: pnpm exec prettier --write src/capture/scroll-area-capture-engine.ts tests/unit/scroll-area-capture-engine.test.ts
      - run: pnpm exec vitest run tests/unit/scroll-area-capture-engine.test.ts
      - name: Commit implementation
        run: |
          git config user.name "webcap-agent"
          git config user.email "webcap-agent@users.noreply.github.com"
          git add src/capture/scroll-area-capture-engine.ts tests/unit/scroll-area-capture-engine.test.ts
          git commit -m "Fix bounded PDF viewer height drift during scroll capture"
          git push origin HEAD:agent/0.2.2-pdf-scroll-stability-hotfix

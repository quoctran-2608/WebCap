name: S31 incremental planning invariants

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/s31-page-native-capture-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/s31-page-native-capture-v2
      - name: Apply focused invariants
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          coordinator = Path("src/background/full-page-capture-coordinator.ts")
          text = coordinator.read_text()
          text, count = re.subn(
              r'(?m)^(\s*)completedTiles: 0,\n\1totalTiles: tiles\.length,$',
              lambda match: (
                  f'{match.group(1)}completedTiles: tiles.filter((tile) => tile.status === "stored").length,\n'
                  f'{match.group(1)}totalTiles: tiles.length,'
              ),
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("S31 coordinator invariant anchor missing")
          coordinator.write_text(text)

          adapter = Path("src/background/scroll-area-page-adapter.ts")
          text = adapter.read_text()
          text, count = re.subn(
              r'(?m)^(\s*)request\.columns === 1$',
              lambda match: (
                  f'{match.group(1)}request.columns === 1 &&\n'
                  f'{match.group(1)}request.expectedScrollWidth === undefined &&\n'
                  f'{match.group(1)}request.expectedScrollHeight === undefined &&\n'
                  f'{match.group(1)}request.expectedClientWidth === undefined &&\n'
                  f'{match.group(1)}request.expectedClientHeight === undefined'
              ),
              text,
              count=1,
          )
          if count != 1:
              raise SystemExit("S31 discovery probe invariant anchor missing")
          old_hint = 'const hint = [descriptor.tagName, ...descriptor.classNames].join(" ");'
          new_hint = 'const hint = [descriptor.tagName, descriptor.id ?? "", ...descriptor.classNames].join(" ");'
          if old_hint not in text:
              raise SystemExit("S31 PDF descriptor hint anchor missing")
          adapter.write_text(text.replace(old_hint, new_hint, 1))
          PY
          git rm .github/workflows/s31-invariant-fix.yml
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/background/full-page-capture-coordinator.ts src/background/scroll-area-page-adapter.ts
      - name: Commit invariants and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Preserve S31 incremental capture invariants"
          git push origin HEAD:agent/s31-page-native-capture-v2

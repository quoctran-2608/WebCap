name: S23 Recovery Diagnostic

on:
  push:
    branches: [agent/s23-adaptive-scroll]

permissions:
  contents: write

concurrency:
  group: s23-recovery-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out S23 branch
        uses: actions/checkout@v4
        with:
          ref: agent/s23-adaptive-scroll
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Instrument recovery error in working tree
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('tests/e2e/adaptive-scroll.spec.ts')
          text = path.read_text()
          replacements = [
              (
                  '  partialReason: string | null;\n  frontier:',
                  '  partialReason: string | null;\n  error: { code: string; causeCode?: string; safeContext?: Record<string, string | number | boolean>; message: string } | null;\n  frontier:',
              ),
              (
                  '        partialCapture?: { reason: string };\n        adaptiveFrontier?: {',
                  '        partialCapture?: { reason: string };\n        error?: { code: string; causeCode?: string; safeContext?: Record<string, string | number | boolean>; message: string };\n        adaptiveFrontier?: {',
              ),
              (
                  '      partialReason: null,\n      frontier: null,',
                  '      partialReason: null,\n      error: null,\n      frontier: null,',
              ),
              (
                  '    partialReason: job.partialCapture?.reason ?? null,\n    frontier:',
                  '    partialReason: job.partialCapture?.reason ?? null,\n    error: job.error ?? null,\n    frontier:',
              ),
              (
                  '        const state = await readAdaptiveJobFromPage(page, jobId);\n        return state.state;',
                  '        const state = await readAdaptiveJobFromPage(page, jobId);\n        if (state.state === "failed") {\n          throw new Error(`Adaptive recovery failed: ${JSON.stringify(state.error)}`);\n        }\n        return state.state;',
              ),
          ]
          for old, new in replacements:
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'Expected one diagnostic anchor, found {count}: {old!r}')
              text = text.replace(old, new)
          path.write_text(text)
          PY
          pnpm exec prettier --write tests/e2e/adaptive-scroll.spec.ts
          pnpm lint
          pnpm typecheck
          pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run restart diagnostic
        shell: bash
        run: |
          set +e
          pnpm exec playwright test tests/e2e/adaptive-scroll.spec.ts --project=visible-smoke --grep "service-worker restart" 2>&1 | tee /tmp/s23-recovery-diagnostic.log
          status=${PIPESTATUS[0]}
          set -e
          git checkout -- tests/e2e/adaptive-scroll.spec.ts
          {
            echo '# S23 adaptive recovery diagnostic'
            echo
            echo "Exit status: ${status}"
            echo
            echo '```text'
            tail -n 160 /tmp/s23-recovery-diagnostic.log
            echo '```'
          } > docs/sessions/s23-recovery-diagnostic.md
          rm .github/workflows/s23-recovery-diagnostic.yml

      - name: Commit diagnostic evidence
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add docs/sessions/s23-recovery-diagnostic.md .github/workflows/s23-recovery-diagnostic.yml
          git commit -m "Record adaptive recovery failure"
          git push origin HEAD:agent/s23-adaptive-scroll

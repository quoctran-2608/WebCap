name: S24 Format I18n Test

on:
  push:
    branches:
      - agent/s24-auto-output

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/s24-auto-output
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply repository formatter
        run: pnpm exec prettier --write tests/unit/i18n.test.ts
      - name: Remove one-shot workflow and validate
        run: |
          rm .github/workflows/s24-format-i18n-test.yml
          pnpm format:check
          pnpm exec vitest run tests/unit/i18n.test.ts
          git diff --check
      - name: Commit exact formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format S24 localization test"
          git push origin HEAD:agent/s24-auto-output

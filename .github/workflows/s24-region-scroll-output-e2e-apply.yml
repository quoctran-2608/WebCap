name: S24 Region Scroll Output E2E Apply

on:
  push:
    branches:
      - agent/s24-auto-output

permissions:
  contents: write

concurrency:
  group: s24-region-scroll-output-e2e-apply
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/s24-auto-output
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply, format, clean, and commit
        run: |
          node scripts/apply-s24-region-scroll-output-e2e.mjs
          pnpm exec prettier --write tests/e2e/region-selection.spec.ts tests/e2e/scroll-area.spec.ts
          rm scripts/apply-s24-region-scroll-output-e2e.mjs
          rm .github/workflows/s24-region-scroll-output-e2e-apply.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Validate region image and scroll-area PDF output"
          git push origin HEAD:agent/s24-auto-output

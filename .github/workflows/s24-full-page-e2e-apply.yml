name: S24 Full Page E2E Apply

on:
  push:
    branches:
      - agent/s24-auto-output

permissions:
  contents: write

concurrency:
  group: s24-full-page-e2e-apply
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out S24 branch
        uses: actions/checkout@v4
        with:
          ref: agent/s24-auto-output
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply S24 E2E expectations
        run: |
          node scripts/apply-s24-full-page-e2e.mjs
          pnpm exec prettier --write tests/e2e/full-page-capture.spec.ts

      - name: Restore release matrix and remove one-shot files
        shell: bash
        run: |
          cat > playwright.config.ts <<'EOF'
          import { defineConfig } from "@playwright/test";

          export default defineConfig({
            testDir: "./tests/e2e",
            fullyParallel: false,
            workers: 1,
            timeout: 60_000,
            expect: {
              timeout: 15_000,
            },
            reporter: process.env.CI ? [["line"], ["html", { open: "never" }]] : "list",
            use: {
              trace: "retain-on-failure",
              screenshot: "only-on-failure",
              video: "retain-on-failure",
            },
            webServer: {
              command: "node tests/e2e/fixture-server.mjs",
              url: "http://127.0.0.1:4174/visible-capture.html",
              reuseExistingServer: !process.env.CI,
              timeout: 15_000,
            },
            projects: [
              {
                name: "visible-smoke",
                grep: /@smoke/,
                use: { deviceScaleFactor: 1 },
              },
              {
                name: "visible-dpr2-zoom125",
                grep: /@dpr/,
                use: { deviceScaleFactor: 2 },
              },
              {
                name: "release-matrix-dpr1",
                grep: /@release-matrix/,
                use: { deviceScaleFactor: 1 },
              },
              {
                name: "release-matrix-dpr15",
                grep: /@release-matrix/,
                use: { deviceScaleFactor: 1.5 },
              },
              {
                name: "release-matrix-dpr2",
                grep: /@release-matrix/,
                use: { deviceScaleFactor: 2 },
              },
            ],
          });
          EOF
          rm scripts/apply-s24-full-page-e2e.mjs
          rm .github/workflows/s24-full-page-e2e-apply.yml
          pnpm exec prettier --write playwright.config.ts

      - name: Validate clean patch
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          git diff --check
          test ! -e scripts/apply-s24-full-page-e2e.mjs
          test ! -e .github/workflows/s24-full-page-e2e-apply.yml

      - name: Commit clean E2E update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update S24 full-page output expectations"
          git push origin HEAD:agent/s24-auto-output

name: S33 export lifecycle temp

on:
  push:
    branches: [agent/s33-recovery-quota-multipart-resilience]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/s33-recovery-quota-multipart-resilience
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python scripts/s33_export_lifecycle_patch.py
      - run: >-
          pnpm exec prettier --write
          src/background/pdf-capture-orchestrator.ts
          src/background/pdf-export-service.ts
          src/background/capture-completion-service.ts
      - name: Validate resumable export lifecycle
        run: |
          pnpm typecheck
          pnpm exec vitest run tests/unit/pdf-capture-orchestrator.test.ts tests/unit/pdf-export-service.test.ts tests/unit/capture-completion-service.test.ts tests/unit/job-state-machine.test.ts
      - run: rm -f scripts/s33_export_lifecycle_patch.py .github/workflows/s33-export-lifecycle-temp.yml
      - name: Commit lifecycle patch
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Implement S33 paused PDF export recovery"
          git push origin HEAD:agent/s33-recovery-quota-multipart-resilience

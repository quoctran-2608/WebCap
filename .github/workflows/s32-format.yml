name: S32 format

on:
  push:
    branches:
      - agent/s32-disk-spool-streaming-writer

permissions:
  contents: write

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/s32-disk-spool-streaming-writer
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Canonicalize S32 files
        run: >-
          pnpm exec prettier --write
          src/shared/contracts/artifact.ts
          src/storage/pdf-output-spool.ts
          src/storage/pdf-writer-checkpoint-repository.ts
          src/offscreen/streaming-pdf-writer.ts
          src/offscreen/streaming-pdf-integrity.ts
          src/offscreen/streaming-pdf-exporter.ts
          src/offscreen/object-url-registry.ts
          src/offscreen/image-processor.ts
          src/offscreen/entry.ts
          tests/unit/streaming-pdf-writer.test.ts
          tests/unit/streaming-pdf-exporter.test.ts
      - name: Commit format and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/s32-format.yml
          git add src/shared/contracts/artifact.ts src/storage/pdf-output-spool.ts src/storage/pdf-writer-checkpoint-repository.ts src/offscreen/streaming-pdf-writer.ts src/offscreen/streaming-pdf-integrity.ts src/offscreen/streaming-pdf-exporter.ts src/offscreen/object-url-registry.ts src/offscreen/image-processor.ts src/offscreen/entry.ts tests/unit/streaming-pdf-writer.test.ts tests/unit/streaming-pdf-exporter.test.ts
          git commit -m "Format S32 disk spool and streaming writer"
          git push origin HEAD:agent/s32-disk-spool-streaming-writer

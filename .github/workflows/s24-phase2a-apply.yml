name: Apply S24 Completion Services

on:
  push:
    branches: [agent/s24-auto-output]

permissions:
  contents: write

concurrency:
  group: s24-phase2a-apply
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out S24 branch
        uses: actions/checkout@v4
        with:
          ref: agent/s24-auto-output
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply, validate, and publish a clean result
        shell: bash
        run: |
          set +e
          : > /tmp/s24-phase2a.log
          python scripts/s24-phase2a-apply.py >> /tmp/s24-phase2a.log 2>&1
          status=$?

          if [ "$status" -eq 0 ]; then
            pnpm exec prettier --write \
              src/background/capture-completion-policy.ts \
              src/background/capture-output.ts \
              src/background/tiled-image-export-service.ts \
              src/background/capture-completion-service.ts \
              src/background/job-coordinator.ts \
              src/background/job-state-machine.ts \
              src/background/pdf-export-service.ts \
              src/shared/contracts/domain.ts \
              src/storage/artifact-repository.ts \
              tests/unit/capture-completion-policy.test.ts \
              tests/unit/tiled-image-export-service.test.ts \
              tests/unit/capture-completion-service.test.ts >> /tmp/s24-phase2a.log 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then pnpm lint >> /tmp/s24-phase2a.log 2>&1; status=$?; fi
          if [ "$status" -eq 0 ]; then pnpm typecheck >> /tmp/s24-phase2a.log 2>&1; status=$?; fi
          if [ "$status" -eq 0 ]; then pnpm test:unit >> /tmp/s24-phase2a.log 2>&1; status=$?; fi
          if [ "$status" -eq 0 ]; then pnpm build >> /tmp/s24-phase2a.log 2>&1; status=$?; fi

          git config user.name "OpenAI coding agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$status" -eq 0 ]; then
            rm scripts/s24-phase2a-apply.py .github/workflows/s24-phase2a-apply.yml
            git add \
              src/background/capture-completion-policy.ts \
              src/background/capture-output.ts \
              src/background/tiled-image-export-service.ts \
              src/background/capture-completion-service.ts \
              src/background/job-coordinator.ts \
              src/background/job-state-machine.ts \
              src/background/pdf-export-service.ts \
              src/shared/contracts/domain.ts \
              src/storage/artifact-repository.ts \
              tests/unit/capture-completion-policy.test.ts \
              tests/unit/tiled-image-export-service.test.ts \
              tests/unit/capture-completion-service.test.ts \
              scripts/s24-phase2a-apply.py \
              .github/workflows/s24-phase2a-apply.yml
            git commit -m "Add mode-aware completion services"
          else
            git reset --hard HEAD
            mkdir -p docs/sessions
            {
              echo '# S24 completion services diagnostic'
              echo
              echo "Exit status: $status"
              echo
              echo '```text'
              tail -c 70000 /tmp/s24-phase2a.log
              echo
              echo '```'
            } > docs/sessions/s24-phase2a-diagnostic.md
            rm scripts/s24-phase2a-apply.py .github/workflows/s24-phase2a-apply.yml
            git add \
              docs/sessions/s24-phase2a-diagnostic.md \
              scripts/s24-phase2a-apply.py \
              .github/workflows/s24-phase2a-apply.yml
            git commit -m "Record S24 completion services validation failure"
          fi

          git push origin HEAD:agent/s24-auto-output

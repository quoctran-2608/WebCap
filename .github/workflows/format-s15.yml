name: Format S15

on:
  push:
    branches: [agent/s15-pdf-benchmarks]

permissions:
  contents: write

concurrency:
  group: format-s15
  cancel-in-progress: false

jobs:
  format:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out S15 branch
        uses: actions/checkout@v4
        with:
          ref: agent/s15-pdf-benchmarks
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format S15 changes
        run: pnpm format

      - name: Remove one-time workflow
        run: rm .github/workflows/format-s15.yml

      - name: Commit formatted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Format S15 PDF validation"
          git push origin HEAD:agent/s15-pdf-benchmarks

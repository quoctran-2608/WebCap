name: Apply and validate S02

on:
  pull_request:
    branches: [main]
    paths:
      - .s02-payload/**
      - S02_VALIDATE
      - .github/workflows/apply-s02.yml

permissions:
  contents: write

concurrency:
  group: apply-s02-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out pull-request branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply verified S02 payload
        run: |
          cat .s02-payload/part-* | base64 --decode > /tmp/webcap-s02.tar.gz
          echo "ed3ce6165b908dbee190561215f4cc86e34f173187cc2279dece94c58a519918  /tmp/webcap-s02.tar.gz" | sha256sum --check
          tar --extract --gzip --file /tmp/webcap-s02.tar.gz --directory .
          rm -rf .s02-payload S02_VALIDATE .github/workflows/apply-s02.yml

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0

      - name: Activate pnpm
        run: |
          corepack enable
          corepack prepare pnpm@11.15.1 --activate

      - name: Update lockfile and install
        run: |
          pnpm install --no-frozen-lockfile
          pnpm install --frozen-lockfile

      - name: Normalize formatting
        run: pnpm format

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Build extension
        run: pnpm build

      - name: Install Chrome for Testing
        run: |
          CFT_URL=$(python <<'PY'
          import json
          import urllib.request

          metadata_url = "https://googlechromelabs.github.io/chrome-for-testing/last-known-good-versions-with-downloads.json"
          with urllib.request.urlopen(metadata_url) as response:
              metadata = json.load(response)
          downloads = metadata["channels"]["Stable"]["downloads"]["chrome"]
          print(next(item["url"] for item in downloads if item["platform"] == "linux64"))
          PY
          )
          curl --fail --location --silent --show-error "$CFT_URL" --output /tmp/chrome-for-testing.zip
          rm -rf /tmp/chrome-for-testing
          mkdir -p /tmp/chrome-for-testing
          unzip -q /tmp/chrome-for-testing.zip -d /tmp/chrome-for-testing
          CHROME_BIN=$(find /tmp/chrome-for-testing -path '*/chrome-linux64/chrome' -type f -print -quit)
          test -n "$CHROME_BIN"
          echo "CHROME_BIN=$CHROME_BIN" >> "$GITHUB_ENV"

      - name: Smoke-test popup and worker contracts
        run: xvfb-run --auto-servernum pnpm test:smoke

      - name: Advance implementation plan and docs
        env:
          VALIDATED_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          python <<'PY'
          import os
          from pathlib import Path

          commit = os.environ["VALIDATED_COMMIT"][:12]
          plan_path = Path("PLAN.md")
          plan = plan_path.read_text(encoding="utf-8")
          replacements = {
              "current_session: S02": "current_session: S03",
              "| S02 | M0 | Shared contracts, settings, errors và CI | S01 | 16k–24k | NEXT |":
                  "| S02 | M0 | Shared contracts, settings, errors và CI | S01 | 16k–24k | DONE |",
              "| S03 | M1 | Visible capture coordinator và Chrome adapter | S02 | 16k–24k | READY |":
                  "| S03 | M1 | Visible capture coordinator và Chrome adapter | S02 | 16k–24k | NEXT |",
              "| S02 | NEXT | — | — | — | Sẵn sàng triển khai contracts, settings, errors và CI. |":
                  f"| S02 | DONE | 2026-08-02 | {commit} | format, lint, typecheck, unit, build, Chrome smoke | Shared Zod contracts, settings migration/repository, error model, safe logger và CI đã được xác thực. |",
              "| S03 | READY | — | — | — | — |":
                  "| S03 | NEXT | — | — | — | Sẵn sàng triển khai visible capture coordinator và Chrome adapter. |",
              "Session kế tiếp là **S02 — Shared contracts, settings, errors và CI**.":
                  "Session kế tiếp là **S03 — Visible capture coordinator và Chrome adapter**.",
              "1. Đọc `PLAN.md` phần S02.\n2. Đọc SPEC §7–12, §24–25 và §28–32.\n3. Kiểm tra repo/branch và kết quả validation S01.\n4. Chỉ triển khai S02.\n5. Kết thúc với contracts/settings/error model dùng chung và CI chính thức chạy xanh.":
                  "1. Đọc `PLAN.md` phần S03.\n2. Đọc PRD visible capture và SPEC §7–14, M1 ở §26/§30.\n3. Kiểm tra repo/branch và kết quả CI S02.\n4. Chỉ triển khai S03.\n5. Kết thúc với visible capture coordinator và Chrome adapter được unit/integration test đầy đủ.",
          }
          for old, new in replacements.items():
              if old not in plan:
                  raise SystemExit(f"PLAN replacement target not found: {old[:100]}")
              plan = plan.replace(old, new, 1)
          plan_path.write_text(plan, encoding="utf-8")

          readme_path = Path("README.md")
          readme = readme_path.read_text(encoding="utf-8")
          old_status = "**S01 — Manifest V3 and worker handshake is complete.** The next session is S02, which introduces shared runtime contracts, settings, normalized errors, and the permanent CI workflow."
          new_status = "**S02 — Foundation M0 is complete.** WebCap now has shared runtime contracts, local settings, normalized errors, safe diagnostics, and permanent CI. The next session is S03 visible capture."
          if old_status not in readme:
              raise SystemExit("README status target not found.")
          readme = readme.replace(old_status, new_status, 1)
          privacy_line = "- [Privacy baseline](./docs/privacy.md)\n"
          if privacy_line not in readme:
              readme = readme.replace("- [Changelog](./CHANGELOG.md)\n", "- [Changelog](./CHANGELOG.md)\n" + privacy_line)
          readme_path.write_text(readme, encoding="utf-8")

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          marker = "### Added\n\n"
          additions = (
              "- Shared Zod domain and runtime message contracts with capability negotiation.\n"
              "- Versioned local settings, migration, normalized errors, safe diagnostics, and permanent CI.\n"
          )
          if additions not in changelog:
              changelog = changelog.replace(marker, marker + additions, 1)
          changelog_path.write_text(changelog, encoding="utf-8")
          PY
          pnpm format
          pnpm format:check

      - name: Commit validated S02 implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Define contracts settings and CI"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

name: S31 verified last-tile fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/s31-page-native-capture-v2'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/s31-page-native-capture-v2
      - name: Require a verified final tile per page
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/capture/page-native-capture-engine.ts")
          lines = path.read_text().splitlines()
          try:
              start = next(
                  index
                  for index, line in enumerate(lines)
                  if "if (!pageCoveredByTiles(page.sourceRectCss, capturedPageTiles))" in line
              )
              progress = next(
                  index
                  for index in range(start, len(lines))
                  if "await context.reportProgress({" in lines[index]
              )
              end = next(
                  index
                  for index in range(progress + 1, len(lines))
                  if lines[index].strip() == "});"
              )
          except StopIteration as error:
              raise SystemExit("S31 last-tile line anchor missing") from error

          indent = lines[start][: len(lines[start]) - len(lines[start].lstrip())]
          replacement = [
              f"{indent}const lastCapturedTile = capturedPageTiles.at(-1);",
              f"{indent}if (",
              f"{indent}  lastCapturedTile === undefined ||",
              f"{indent}  !pageCoveredByTiles(page.sourceRectCss, capturedPageTiles)",
              f"{indent}) {{",
              f"{indent}  throw captureError({{",
              f'{indent}    code: "E_LAYOUT_UNSTABLE",',
              f'{indent}    message: "A logical PDF page was not fully verified before advancing.",',
              f'{indent}    userMessageKey: "errors.layoutChanged",',
              f'{indent}    causeCode: "PdfPageCoverageGap",',
              f"{indent}    safeContext: {{ pageIndex: page.index, pageTiles: capturedPageTiles.length }},",
              f"{indent}  }});",
              f"{indent}}}",
              f"{indent}completedPages += 1;",
              f"{indent}await context.reportProgress({{",
              f"{indent}  jobId: context.jobId,",
              f'{indent}  state: "capturing",',
              f'{indent}  stage: "storing",',
              f"{indent}  completed: completedPages,",
              f"{indent}  total: documentPageMap.sourcePageCount,",
              f"{indent}  tileIndex: lastCapturedTile.index,",
              f"{indent}}});",
          ]
          path.write_text("\n".join(lines[:start] + replacement + lines[end + 1 :]) + "\n")
          PY
          git rm .github/workflows/s31-last-tile-fix.yml
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec prettier --write src/capture/page-native-capture-engine.ts
      - name: Commit fix and remove helper
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Require verified final tile for S31 page progress"
          git push origin HEAD:agent/s31-page-native-capture-v2

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out S21 branch
        uses: actions/checkout@v4
        with:
          ref: agent/s21-capture-reset
          fetch-depth: 0

      - name: Synchronize S21 documentation and restore read-only CI
        run: |
          python .github/s21-docs-update.py
          rm .github/s21-docs-update.py
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          git add -A

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format synchronized files
        run: pnpm format

      - name: Validate implementation and docs
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test:unit
          pnpm build

      - name: Commit S21 documentation and E2E synchronization
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Document and verify S21 capture reset"
          git push origin HEAD:agent/s21-capture-reset

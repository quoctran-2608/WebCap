name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fix and format S08 branch
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/s08-page-preparation'
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "src/background/page-preparation-service.ts": [(
                  '    if (cleanupError !== undefined) {\n      throw cleanupError;\n    }',
                  '    if (cleanupError !== undefined) {\n      if (cleanupError instanceof Error) {\n        throw cleanupError;\n      }\n      throw createWebCapRuntimeError(\n        normalizeError(cleanupError, {\n          code: "E_CLEANUP_PARTIAL",\n          stage: "cleanup",\n          userMessageKey: "errors.cleanupPartial",\n          retryable: true,\n          fallbackAllowed: false,\n        }),\n      );\n    }',
              )],
              "tests/e2e/page-preparation.spec.ts": [
                  (
                      '''async function sendContentMessage(
  serviceWorker: Worker,
  tabId: number,
  message: Record<string, unknown>,
): Promise<Record<string, unknown>> {
  return serviceWorker.evaluate(
    async ({ id, payload }) => await chrome.tabs.sendMessage<Record<string, unknown>>(id, payload),
    { id: tabId, payload: message },
  );
}''',
                      '''async function sendContentMessage(
  serviceWorker: Worker,
  tabId: number,
  message: Record<string, unknown>,
): Promise<Record<string, unknown>> {
  return serviceWorker.evaluate(
    async ({ id, payload }) => {
      const response: unknown = await chrome.tabs.sendMessage(id, payload);
      if (typeof response !== "object" || response === null) {
        throw new TypeError("The content script returned a non-object response.");
      }
      return response as Record<string, unknown>;
    },
    { id: tabId, payload: message },
  );
}''',
                  ),
                  (
                      '''    async ({ id, prepare, cancel }) => {
      const pending = chrome.tabs.sendMessage<Record<string, unknown>>(id, prepare);
      await new Promise((resolve) => setTimeout(resolve, 60));
      const cancelResponse = await chrome.tabs.sendMessage<Record<string, unknown>>(id, cancel);
      const prepareResponse = await pending;
      return { cancelResponse, prepareResponse };
    },''',
                      '''    async ({ id, prepare, cancel }) => {
      const pending: Promise<unknown> = chrome.tabs.sendMessage(id, prepare);
      await new Promise((resolve) => setTimeout(resolve, 60));
      const cancelResponse: unknown = await chrome.tabs.sendMessage(id, cancel);
      const prepareResponse: unknown = await pending;
      if (
        typeof cancelResponse !== "object" ||
        cancelResponse === null ||
        typeof prepareResponse !== "object" ||
        prepareResponse === null
      ) {
        throw new TypeError("The content script returned a non-object response.");
      }
      return {
        cancelResponse: cancelResponse as Record<string, unknown>,
        prepareResponse: prepareResponse as Record<string, unknown>,
      };
    },''',
                  ),
              ],
          }

          for file_name, pairs in replacements.items():
              path = Path(file_name)
              text = path.read_text()
              for before, after in pairs:
                  if before in text:
                      text = text.replace(before, after)
                  elif after not in text:
                      raise SystemExit(f"Expected lint pattern not found in {file_name}: {before[:80]}")
              path.write_text(text)
          PY
          pnpm exec prettier --write \
            src/background/page-preparation-service.ts \
            tests/e2e/page-preparation.spec.ts
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              src/background/page-preparation-service.ts \
              tests/e2e/page-preparation.spec.ts
            git commit -m "Harden page preparation error boundaries"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Build extension
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Visible capture E2E
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

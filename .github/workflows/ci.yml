name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format and complete S09 branch
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/s09-cdp-full-page-capture'
        run: |
          node scripts/complete-s09-plan.mjs
          pnpm exec prettier --write \
            PLAN.md \
            README.md \
            CHANGELOG.md \
            docs/manual-testing.md \
            src/background/full-page-capture-coordinator.ts \
            src/background/persistent-job-router.ts \
            src/capture/cdp-capture-engine.ts \
            src/popup/App.tsx \
            src/popup/full-page-client.ts \
            tests/e2e/full-page-capture.spec.ts \
            tests/unit/cdp-capture-engine.test.ts \
            tests/unit/full-page-capture-coordinator.test.ts \
            tests/unit/persistent-job-router.test.ts
          rm -f scripts/complete-s09-plan.mjs .github/workflows/format-s09.yml
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Complete S09 roadmap and documentation"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Build extension
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Visible capture E2E
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    if: github.event_name == 'pull_request' && github.head_ref == 'agent/s16-scrollable-container'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out S16 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply atomic S16 patch
        run: |
          cat \
            scripts/s16-patch/00 \
            scripts/s16-patch/01 \
            scripts/s16-patch/02 \
            scripts/s16-patch/03 \
            scripts/s16-patch/04a \
            scripts/s16-patch/04b \
            scripts/s16-patch/04c \
            scripts/s16-patch/05 \
            scripts/s16-patch/06 \
            | base64 --decode \
            | gzip --decompress \
            > /tmp/s16.patch
          git apply --check /tmp/s16.patch
          git apply /tmp/s16.patch
          rm -rf scripts/s16-patch
          printf '%s' '' | base64 --decode > .github/workflows/ci.yml
          pnpm format
          git diff --check

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: PDF performance benchmark
        run: pnpm benchmark:pdf

      - name: Build extension
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Extension E2E
        run: pnpm test:e2e

      - name: Commit validated S16 implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement scrollable area capture"
          git push origin HEAD:${GITHUB_HEAD_REF}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

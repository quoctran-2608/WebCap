name: Apply and validate S05

on:
  push:
    branches: [agent/s05-preview-visible-e2e]

permissions:
  contents: write

concurrency:
  group: apply-s05-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out S05 branch
        uses: actions/checkout@v4
        with:
          ref: agent/s05-preview-visible-e2e
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install existing dependencies
        run: pnpm install --frozen-lockfile

      - name: Reassemble and apply S05
        run: |
          cat s05-payload/* > /tmp/apply-s05.py.gz.b64
          base64 --decode /tmp/apply-s05.py.gz.b64 > /tmp/apply-s05.py.gz
          echo "f447dd3dd9381d6b18f5084b9963803986c63f0875003f25cf6147c2af7cfd63  /tmp/apply-s05.py.gz" | sha256sum --check
          gzip --test /tmp/apply-s05.py.gz
          gzip --decompress --stdout /tmp/apply-s05.py.gz > scripts/apply-s05.py
          python scripts/apply-s05.py
          pnpm add --save-dev --save-exact @playwright/test@latest

      - name: Format implementation
        run: pnpm format

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Build extension
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Visible capture E2E
        run: pnpm test:e2e

      - name: Commit validated implementation
        run: |
          rm -rf s05-payload scripts/apply-s05.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Complete visible capture preview flow"
          git push origin HEAD:agent/s05-preview-visible-e2e

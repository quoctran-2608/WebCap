name: Apply and validate S05

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: apply-s05-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out S05 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install existing dependencies
        run: pnpm install --frozen-lockfile

      - name: Reassemble and apply S05
        run: |
          cat s05-payload/* > /tmp/apply-s05.py.gz.b64
          base64 --decode /tmp/apply-s05.py.gz.b64 > /tmp/apply-s05.py.gz
          echo "f447dd3dd9381d6b18f5084b9963803986c63f0875003f25cf6147c2af7cfd63  /tmp/apply-s05.py.gz" | sha256sum --check
          gzip --test /tmp/apply-s05.py.gz
          gzip --decompress --stdout /tmp/apply-s05.py.gz > scripts/apply-s05.py
          python scripts/apply-s05.py
          pnpm add --save-dev --save-exact @playwright/test@latest

      - name: Apply S05 typed corrections
        run: |
          python - <<'PY'
          from pathlib import Path

          app = Path("src/popup/App.tsx")
          text = app.read_text(encoding="utf-8")
          text = text.replace("revoke = preview.revoke;", "revoke = () => preview.revoke();")
          text = text.replace("onClick={handleCancel}", "onClick={() => void handleCancel()}")
          text = text.replace(
              "const resumedSessionRef = useRef<string>();",
              "const resumedSessionRef = useRef<string | undefined>(undefined);",
          )
          text = text.replace(
              "const activeCaptureRequestIdRef = useRef<string>();",
              "const activeCaptureRequestIdRef = useRef<string | undefined>(undefined);",
          )
          app.write_text(text, encoding="utf-8")

          worker = Path("src/popup/worker-client.ts")
          text = worker.read_text(encoding="utf-8")
          text = text.replace(
              '''  const request = createVisibleCaptureStartMessage({
    requestId: options.captureRequestId ?? createRequestId(),
    outputFormat: options.outputFormat,
    quality: options.quality,
    sentAt: now().toISOString(),
  });''',
              '''  const request = createVisibleCaptureStartMessage({
    requestId: options.captureRequestId ?? createRequestId(),
    ...(options.outputFormat === undefined ? {} : { outputFormat: options.outputFormat }),
    ...(options.quality === undefined ? {} : { quality: options.quality }),
    sentAt: now().toISOString(),
  });''',
          )
          worker.write_text(text, encoding="utf-8")

          e2e = Path("tests/e2e/visible-capture.spec.ts")
          text = e2e.read_text(encoding="utf-8")
          text = text.replace(
              '''    return [
      [0.25, 0.25],
      [0.75, 0.25],
      [0.25, 0.75],
      [0.75, 0.75],
    ].map(([x, y]) => {''',
              '''    const samplePoints: Array<readonly [number, number]> = [
      [0.25, 0.25],
      [0.75, 0.25],
      [0.25, 0.75],
      [0.75, 0.75],
    ];

    return samplePoints.map(([x, y]) => {''',
          )
          e2e.write_text(text, encoding="utf-8")

          server = Path("tests/e2e/fixture-server.mjs")
          text = server.read_text(encoding="utf-8")
          text = text.replace(
              'import { extname, join, normalize } from "node:path";\n',
              'import { extname, join, normalize } from "node:path";\n'
              'import process from "node:process";\n'
              'import { URL } from "node:url";\n',
          )
          text = text.replace(
              '  console.log(`WebCap fixture server listening on http://${host}:${port}`);',
              '  process.stdout.write(`WebCap fixture server listening on http://${host}:${port}\\n`);',
          )
          server.write_text(text, encoding="utf-8")
          PY

      - name: Format implementation
        run: pnpm format

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Build extension
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Visible capture E2E
        run: pnpm test:e2e

      - name: Commit validated implementation
        run: |
          rm -rf s05-payload scripts/apply-s05.py
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Complete visible capture preview flow"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

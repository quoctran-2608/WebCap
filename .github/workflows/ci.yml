name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Fix and format S08 branch
        if: github.event_name == 'pull_request' && github.head_ref == 'agent/s08-page-preparation'
        run: |
          python - <<'PY'
          from pathlib import Path

          replacements = {
              "src/content/entry.ts": [(
                  'function hasString(value: Record<string, unknown>, key: string): boolean {\n  return typeof value[key] === "string" && (value[key] as string).length > 0;\n}',
                  'function hasString(value: Record<string, unknown>, key: string): boolean {\n  const candidate = value[key];\n  return typeof candidate === "string" && candidate.length > 0;\n}',
              )],
              "src/background/page-preparation-service.ts": [(
                  '    if (!operationSucceeded) {\n      throw operationError;\n    }',
                  '    if (!operationSucceeded) {\n      if (operationError instanceof Error) {\n        throw operationError;\n      }\n      throw createWebCapRuntimeError(\n        normalizeError(operationError, {\n          stage: "capture",\n          userMessageKey: "errors.captureFailed",\n          retryable: true,\n          fallbackAllowed: false,\n        }),\n      );\n    }',
              )],
              "tests/e2e/page-preparation.spec.ts": [
                  (
                      '(await chrome.tabs.sendMessage(id, payload)) as Record<string, unknown>',
                      'await chrome.tabs.sendMessage<Record<string, unknown>>(id, payload)',
                  ),
                  (
                      'const pending = chrome.tabs.sendMessage(id, prepare) as Promise<Record<string, unknown>>;',
                      'const pending = chrome.tabs.sendMessage<Record<string, unknown>>(id, prepare);',
                  ),
                  (
                      'const cancelResponse = (await chrome.tabs.sendMessage(id, cancel)) as Record<string, unknown>;',
                      'const cancelResponse = await chrome.tabs.sendMessage<Record<string, unknown>>(id, cancel);',
                  ),
              ],
              "tests/unit/page-preparation-service.test.ts": [(
                  'const operation = vi.fn(async () => "captured");',
                  'const operation = vi.fn(() => Promise.resolve("captured"));',
              )],
          }

          for file_name, pairs in replacements.items():
              path = Path(file_name)
              text = path.read_text()
              for before, after in pairs:
                  if before not in text:
                      raise SystemExit(f"Expected lint pattern not found in {file_name}: {before[:80]}")
                  text = text.replace(before, after)
              path.write_text(text)
          PY
          pnpm exec prettier --write \
            src/content/entry.ts \
            src/background/page-preparation-service.ts \
            src/shared/contracts/page-preparation.ts \
            tests/e2e/page-preparation.spec.ts \
            tests/fixtures/animated-page.html \
            tests/fixtures/fixed-sticky.html \
            tests/fixtures/layout-shift.html \
            tests/fixtures/lazy-images.html \
            tests/unit/page-preparation-content.test.ts \
            tests/unit/page-preparation-service.test.ts
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add \
              src/content/entry.ts \
              src/background/page-preparation-service.ts \
              src/shared/contracts/page-preparation.ts \
              tests/e2e/page-preparation.spec.ts \
              tests/fixtures/animated-page.html \
              tests/fixtures/fixed-sticky.html \
              tests/fixtures/layout-shift.html \
              tests/fixtures/lazy-images.html \
              tests/unit/page-preparation-content.test.ts \
              tests/unit/page-preparation-service.test.ts
            git commit -m "Fix and format page preparation files"
            git push origin HEAD:${GITHUB_HEAD_REF}
          fi

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Build extension
        run: pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Visible capture E2E
        run: pnpm test:e2e

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

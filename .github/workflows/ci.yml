name: Finalize S04 documentation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: finalize-s04-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out S04 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Update S04 documentation
        run: |
          python - <<'PY'
          from pathlib import Path

          plan = Path("PLAN.md")
          text = plan.read_text(encoding="utf-8")
          replacements = {
              "current_session: S04": "current_session: S05",
              "| S04 | M1 | Offscreen processing, artifact storage và download | S03 | 18k–26k | NEXT |": "| S04 | M1 | Offscreen processing, artifact storage và download | S03 | 18k–26k | DONE |",
              "| S05 | M1 | Preview UI và visible-capture E2E | S04 | 16k–24k | READY |": "| S05 | M1 | Preview UI và visible-capture E2E | S04 | 16k–24k | NEXT |",
              "**Commit gợi ý:** `Add offscreen image export and download`.\n\n---": "**Commit gợi ý:** `Add offscreen image export and download`.\n\n**Hoàn thành:** 2026-08-02 · PR #8 · validation head `a4eeaa5`.\n\n**Ghi chú kỹ thuật:** source/output image được lưu bằng Blob trong IndexedDB; offscreen manager chống race bằng runtime.getContexts(), encode PNG/JPEG/WebP và quản lý Blob URL; download luôn revoke URL trong finally; retry export/download không gọi captureVisibleTab lại. CI sạch pass format, lint, typecheck, 69 unit tests và build có offscreen.html/offscreen.js. Manual Chrome E2E được giữ đúng phạm vi S05.\n\n---",
              "| S04 | NEXT | — | — | — | Sẵn sàng triển khai offscreen processing, artifact storage và download. |": "| S04 | DONE | 2026-08-02 | PR #8 / a4eeaa5 | format, lint, typecheck, 69 unit, build | Blob artifact persistence, offscreen PNG/JPEG/WebP processing, filename sanitizer, download lifecycle và retry không recapture đã được xác thực. |",
              "| S05 | READY | — | — | — | — |": "| S05 | NEXT | — | — | — | Sẵn sàng hoàn tất preview UI và visible-capture E2E. |",
              "Session kế tiếp là **S04 — Offscreen processing, artifact storage và download**.": "Session kế tiếp là **S05 — Preview UI và visible-capture E2E**.",
              "1. Đọc `PLAN.md` phần S04.\n2. Đọc SPEC §11–12, §21 và §23–25.\n3. Kiểm tra repo/branch và kết quả CI S03.\n4. Chỉ triển khai S04.\n5. Kết thúc với offscreen processing, artifact storage và download được unit/integration test đầy đủ.": "1. Đọc `PLAN.md` phần S05.\n2. Đọc PRD acceptance criteria cho visible/image export, SPEC UI M1 và §27.\n3. Kiểm tra repo/branch và kết quả CI S04.\n4. Chỉ triển khai S05.\n5. Kết thúc với preview UI, popup state synchronization và visible-capture E2E smoke đầy đủ.",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"PLAN replacement expected once, found {count}: {old!r}")
              text = text.replace(old, new)
          plan.write_text(text, encoding="utf-8")

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          old = "**S03 — Visible capture foundation is complete.** WebCap now captures the active viewport through a typed Chrome adapter and in-memory coordinator, validates tab support, deduplicates requests, rate-limits Chrome capture calls, normalizes cancellation and errors, and keeps image bytes out of runtime messages. The next session is S04 offscreen processing, artifact storage, and download."
          new = "**S04 — Offscreen image export is complete.** WebCap now persists captured image Blobs in IndexedDB, processes PNG/JPEG/WebP output in a race-safe offscreen document, generates safe filenames, starts Chrome downloads with deterministic Blob URL cleanup, and retries export/download without recapturing the page. The next session is S05 preview UI and visible-capture E2E."
          if text.count(old) != 1:
              raise SystemExit("README status paragraph did not match exactly once")
          readme.write_text(text.replace(old, new), encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          marker = "### Added\n\n"
          addition = (
              "- IndexedDB artifact storage with Blob-backed source/output records and expiry cleanup.\n"
              "- Race-safe offscreen document processing for PNG, JPEG, and WebP image artifacts.\n"
              "- Sanitized title/domain/timestamp filenames and Chrome download lifecycle with Blob URL revocation.\n"
              "- Metadata-only export/download runtime contracts with retry and request deduplication that avoid recapture.\n"
          )
          if text.count(marker) != 1:
              raise SystemExit("CHANGELOG Added marker did not match exactly once")
          changelog.write_text(text.replace(marker, marker + addition, 1), encoding="utf-8")
          PY

      - name: Commit finalized S04 documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PLAN.md README.md CHANGELOG.md
          git diff --cached --check
          git commit -m "Finalize S04 roadmap"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

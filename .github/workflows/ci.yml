name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format S03 files
        run: >-
          pnpm exec prettier --write
          src/background/tab-capability.ts
          src/background/visible-capture-coordinator.ts
          src/popup/App.tsx
          tests/unit/capture-rate-limiter.test.ts
          tests/unit/messages.test.ts

      - name: Upload formatted S03 files
        uses: actions/upload-artifact@v4
        with:
          name: s03-prettier-output
          path: |
            src/background/tab-capability.ts
            src/background/visible-capture-coordinator.ts
            src/popup/App.tsx
            tests/unit/capture-rate-limiter.test.ts
            tests/unit/messages.test.ts

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test:unit

      - name: Build extension
        run: pnpm build

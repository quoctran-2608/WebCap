name: S22 Browser Fix

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: s22-browser-fix-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Check out S22 branch
        uses: actions/checkout@v4
        with:
          ref: agent/s22-region-selector
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply browser interaction fix
        run: node scripts/s22-browser-fix.mjs

      - name: Restore read-only CI
        run: git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml

      - name: Format and validate
        run: |
          pnpm format
          pnpm lint
          pnpm typecheck
          pnpm test:unit
          pnpm build

      - name: Commit clean browser fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix S22 selector toolbar layering and browser cleanup coverage"
          git push origin HEAD:agent/s22-region-selector

name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out S29 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format only S29 files
        run: >-
          pnpm exec prettier --write
          src/background/pdf-source-cdp-recovery.ts
          src/background/pdf-source-service.ts
          src/shared/crypto/sha256-stream.ts
          tests/unit/pdf-source-service.test.ts

      - name: Commit exact formatter output
        run: |
          if git diff --quiet -- \
            src/background/pdf-source-cdp-recovery.ts \
            src/background/pdf-source-service.ts \
            src/shared/crypto/sha256-stream.ts \
            tests/unit/pdf-source-service.test.ts; then
            exit 0
          fi
          git config user.name "webcap-ci"
          git config user.email "webcap-ci@users.noreply.github.com"
          git add -- \
            src/background/pdf-source-cdp-recovery.ts \
            src/background/pdf-source-service.ts \
            src/shared/crypto/sha256-stream.ts \
            tests/unit/pdf-source-service.test.ts
          git commit -m "Format S29 source acquisition"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

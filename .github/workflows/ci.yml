name: Finalize S03 documentation

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: finalize-s03-${{ github.ref }}
  cancel-in-progress: true

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out S03 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Update S03 documentation
        run: |
          python - <<'PY'
          from pathlib import Path

          plan = Path("PLAN.md")
          text = plan.read_text(encoding="utf-8")
          replacements = {
              "current_session: S03": "current_session: S04",
              "| S03 | M1 | Visible capture coordinator và Chrome adapter | S02 | 16k–24k | NEXT |": "| S03 | M1 | Visible capture coordinator và Chrome adapter | S02 | 16k–24k | DONE |",
              "| S04 | M1 | Offscreen processing, artifact storage và download | S03 | 18k–26k | READY |": "| S04 | M1 | Offscreen processing, artifact storage và download | S03 | 18k–26k | NEXT |",
              "**Commit gợi ý:** `Implement visible capture coordinator`.\n\n---": "**Commit gợi ý:** `Implement visible capture coordinator`.\n\n**Hoàn thành:** 2026-08-02 · PR #7 · validation head `710ce8d`.\n\n**Ghi chú kỹ thuật:** visible/PNG đã hoạt động qua typed Chrome adapter và coordinator in-memory; runtime chỉ truyền metadata, request trùng được dedupe, capture cạnh tranh bị chặn và cancel được normalize. CI sạch pass format, lint, typecheck, 52 unit tests và build. Pixel persistence, offscreen processing và download được chuyển đúng sang S04.\n\n---",
              "| S03 | NEXT | — | — | — | Sẵn sàng triển khai visible capture coordinator và Chrome adapter. |": "| S03 | DONE | 2026-08-02 | PR #7 / 710ce8d | format, lint, typecheck, 52 unit, build | Visible capture coordinator, typed Chrome adapter, metadata-only protocol, dedupe, rate limit và cancel đã được xác thực. |",
              "| S04 | READY | — | — | — | — |": "| S04 | NEXT | — | — | — | Sẵn sàng triển khai offscreen processing, artifact storage và download. |",
              "Session kế tiếp là **S03 — Visible capture coordinator và Chrome adapter**.": "Session kế tiếp là **S04 — Offscreen processing, artifact storage và download**.",
              "1. Đọc `PLAN.md` phần S03.\n2. Đọc PRD visible capture và SPEC §7–14, M1 ở §26/§30.\n3. Kiểm tra repo/branch và kết quả CI S02.\n4. Chỉ triển khai S03.\n5. Kết thúc với visible capture coordinator và Chrome adapter được unit/integration test đầy đủ.": "1. Đọc `PLAN.md` phần S04.\n2. Đọc SPEC §11–12, §21 và §23–25.\n3. Kiểm tra repo/branch và kết quả CI S03.\n4. Chỉ triển khai S04.\n5. Kết thúc với offscreen processing, artifact storage và download được unit/integration test đầy đủ.",
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"PLAN replacement expected once, found {count}: {old!r}")
              text = text.replace(old, new)
          plan.write_text(text, encoding="utf-8")

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")
          old = "**S02 — Foundation M0 is complete.** WebCap now has shared runtime contracts, local settings, normalized errors, safe diagnostics, and permanent CI. The next session is S03 visible capture."
          new = "**S03 — Visible capture foundation is complete.** WebCap now captures the active viewport through a typed Chrome adapter and in-memory coordinator, validates tab support, deduplicates requests, rate-limits Chrome capture calls, normalizes cancellation and errors, and keeps image bytes out of runtime messages. The next session is S04 offscreen processing, artifact storage, and download."
          if text.count(old) != 1:
              raise SystemExit("README status paragraph did not match exactly once")
          readme.write_text(text.replace(old, new), encoding="utf-8")

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text(encoding="utf-8")
          marker = "### Added\n\n"
          addition = (
              "- Visible viewport capture through a typed Chrome tabs adapter and in-memory coordinator.\n"
              "- Active-tab capability checks for supported web/file URLs and normalized restricted-page errors.\n"
              "- Metadata-only capture protocol with request deduplication, single-job locking, rate limiting, and cancellation.\n"
              "- Stable visible-capture fixture, focused unit/integration coverage, and manual Chrome validation guidance.\n"
          )
          if text.count(marker) != 1:
              raise SystemExit("CHANGELOG Added marker did not match exactly once")
          changelog.write_text(text.replace(marker, marker + addition, 1), encoding="utf-8")
          PY

      - name: Restore permanent CI workflow
        run: |
          cat > .github/workflows/ci.yml <<'YAML'
          name: CI

          on:
            pull_request:
              branches: [main]
            push:
              branches: [main]

          permissions:
            contents: read

          concurrency:
            group: ci-${{ github.workflow }}-${{ github.ref }}
            cancel-in-progress: true

          jobs:
            quality:
              runs-on: ubuntu-latest
              timeout-minutes: 15

              steps:
                - name: Check out repository
                  uses: actions/checkout@v4

                - name: Set up pnpm
                  uses: pnpm/action-setup@v4
                  with:
                    version: 11.15.1
                    run_install: false

                - name: Set up Node.js
                  uses: actions/setup-node@v4
                  with:
                    node-version: 22.22.0
                    cache: pnpm

                - name: Install dependencies
                  run: pnpm install --frozen-lockfile

                - name: Check formatting
                  run: pnpm format:check

                - name: Lint
                  run: pnpm lint

                - name: Typecheck
                  run: pnpm typecheck

                - name: Unit tests
                  run: pnpm test:unit

                - name: Build extension
                  run: pnpm build
          YAML

      - name: Commit finalized S03 documentation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PLAN.md README.md CHANGELOG.md .github/workflows/ci.yml
          git diff --cached --check
          git commit -m "Finalize S03 roadmap"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Detect S27 follow-up patch
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'agent/s27-dedicated-pdf-capture'
        run: |
          if [ "$(git log -1 --pretty=%s)" = "Apply S27 editor and memory follow-up" ]; then
            echo "S27_FOLLOWUP=1" >> "$GITHUB_ENV"
          fi

      - name: Apply S27 follow-up patch
        if: env.S27_FOLLOWUP == '1'
        run: node scripts/apply-s27-follow-up.mjs

      - name: Format S27 follow-up
        if: env.S27_FOLLOWUP == '1'
        run: >-
          pnpm exec prettier --write
          src/background/pdf-editor-service.ts
          src/content/entry.ts
          src/offscreen/pdf-exporter.ts
          src/shared/contracts/job.ts
          tests/unit/job-summary-document-progress.test.ts
          tests/unit/pdf-editor-service.test.ts
          tests/unit/pdf-exporter.test.ts

      - name: Validate S27 follow-up
        if: env.S27_FOLLOWUP == '1'
        run: >-
          pnpm typecheck && pnpm exec vitest run
          tests/unit/job-summary-document-progress.test.ts
          tests/unit/pdf-editor-service.test.ts
          tests/unit/pdf-exporter.test.ts

      - name: Commit S27 follow-up
        if: env.S27_FOLLOWUP == '1'
        run: |
          git config user.name "webcap-agent"
          git config user.email "webcap-agent@users.noreply.github.com"
          git add src tests
          git commit -m "Complete page-aware PDF editor and streaming memory model"
          git push origin HEAD:agent/s27-dedicated-pdf-capture

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Privacy, dependency, and release audit
        run: pnpm run audit

      - name: Critical dependency audit
        run: pnpm audit:security

      - name: Unit tests
        run: pnpm test:unit

      - name: PDF performance benchmark
        run: pnpm benchmark:pdf

      - name: Build extension
        run: pnpm build

      - name: Reproduce and verify release ZIP
        run: node scripts/verify-reproducible-package.mjs

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Full extension E2E
        run: pnpm test:e2e

      - name: Packaged lifecycle smoke
        run: pnpm test:release

      - name: Upload release candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webcap-release-candidate-${{ github.sha }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

name: S23 Final E2E Fixes

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: s23-final-e2e-fixes-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out S23 branch
        uses: actions/checkout@v4
        with:
          ref: agent/s23-adaptive-scroll
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply final S23 E2E fixes
        run: node scripts/s23-final-e2e-fixes.mjs

      - name: Remove staging and restore read-only CI
        run: |
          rm scripts/s23-final-e2e-fixes.mjs
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml

      - name: Validate final harness fixes
        run: |
          pnpm format
          pnpm format:check
          pnpm lint
          pnpm typecheck
          git diff --check

      - name: Commit clean final fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Finalize S23 worker-restart and PDF E2E coverage"
          git push origin HEAD:agent/s23-adaptive-scroll

name: S23 Format

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: s23-format-${{ github.ref }}
  cancel-in-progress: true

jobs:
  format:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out S23 branch
        uses: actions/checkout@v4
        with:
          ref: agent/s23-adaptive-scroll
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format and restore read-only CI
        run: |
          pnpm format
          git show origin/main:.github/workflows/ci.yml > .github/workflows/ci.yml
          pnpm format:check
          git diff --check

      - name: Commit clean formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Format S23 adaptive capture tests"
          git push origin HEAD:agent/s23-adaptive-scroll

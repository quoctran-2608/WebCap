        run: |
          printf '%s' "$S24_DOC_SCRIPT_GZ_B64" | tr -d '[:space:]' | base64 --decode | gzip --decompress > /tmp/close-s24-docs.py
          python /tmp/close-s24-docs.py
          pnpm exec prettier --write PLAN.md README.md CHANGELOG.md docs/spec-0.2.0.md
          git checkout origin/main -- .github/workflows/ci.yml
          rm .github/workflows/close-s24-docs-once.yml
      - name: Commit clean milestone close
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PLAN.md README.md CHANGELOG.md docs/spec-0.2.0.md .github/workflows/ci.yml .github/workflows/close-s24-docs-once.yml
          git commit -m "docs: close S24 output milestone"
          git push origin HEAD:agent/s24-auto-output

  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Privacy, dependency, and release audit
        run: pnpm run audit

      - name: Critical dependency audit
        run: pnpm audit:security

      - name: Unit tests
        run: pnpm test:unit

      - name: PDF performance benchmark
        run: pnpm benchmark:pdf

      - name: Build extension
        run: pnpm build

      - name: Reproduce and verify release ZIP
        run: node scripts/verify-reproducible-package.mjs

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Full extension E2E
        run: pnpm test:e2e

      - name: Packaged lifecycle smoke
        run: pnpm test:release

      - name: Upload release candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: webcap-release-candidate-${{ github.sha }}
          path: artifacts/
          if-no-files-found: ignore
          retention-days: 14

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format S29 files
        run: >-
          pnpm exec prettier --write
          src/background/pdf-source-cdp-recovery.ts
          src/background/pdf-source-service.ts
          src/shared/crypto/sha256-stream.ts
          tests/unit/pdf-source-service.test.ts

      - name: Upload formatted S29 files
        uses: actions/upload-artifact@v4
        with:
          name: s29-formatted-${{ github.sha }}
          path: |
            src/background/pdf-source-cdp-recovery.ts
            src/background/pdf-source-service.ts
            src/shared/crypto/sha256-stream.ts
            tests/unit/pdf-source-service.test.ts
          retention-days: 1

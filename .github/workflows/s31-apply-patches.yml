name: S31 integration patch

on:
  push:
    branches:
      - agent/s31-page-native-capture-v2

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/s31-page-native-capture-v2
      - name: Apply focused S31 integration changes
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if new in text:
                  return
              if old not in text:
                  raise SystemExit(f"Expected patch anchor not found: {path}")
              file.write_text(text.replace(old, new, 1))

          replace_once(
              "src/background/scroll-area-page-adapter.ts",
              '''    request.scrollLeft === 0 &&
              request.scrollTop === 0 &&
              request.row === 0 &&
              request.column === 0 &&
              request.rows === 1 &&
              request.columns === 1
          ''',
              '''    request.scrollLeft === 0 &&
              request.scrollTop === 0 &&
              request.row === 0 &&
              request.column === 0 &&
              request.rows === 1 &&
              request.columns === 1 &&
              request.expectedScrollWidth === undefined &&
              request.expectedScrollHeight === undefined &&
              request.expectedClientWidth === undefined &&
              request.expectedClientHeight === undefined
          ''',
          )

          replace_once(
              "src/background/persistent-job-router.ts",
              '''import { ScrollAreaCaptureEngine } from "@capture/scroll-area-capture-engine";
          ''',
              '''import { PageNativeCaptureEngine } from "@capture/page-native-capture-engine";
          import { ScrollAreaCaptureEngine } from "@capture/scroll-area-capture-engine";
          ''',
          )
          replace_once(
              "src/background/persistent-job-router.ts",
              '''  const scrollAreaCaptures = new FullPageCaptureCoordinator({
              jobs,
              tiles,
              preparePage: false,
              engine: new ScrollAreaCaptureEngine({ pages: scrollAreaPages, tabs }),
              targetValidator: elements,
            });
          ''',
              '''  const genericScrollAreaEngine = new ScrollAreaCaptureEngine({ pages: scrollAreaPages, tabs });
            const scrollAreaCaptures = new FullPageCaptureCoordinator({
              jobs,
              tiles,
              preparePage: false,
              engine: new PageNativeCaptureEngine({
                pages: scrollAreaPages,
                tabs,
                fallback: genericScrollAreaEngine,
              }),
              targetValidator: elements,
            });
          ''',
          )

          replace_once(
              "src/background/full-page-capture-coordinator.ts",
              '''      tilePlan: tiles,
              completedTiles: 0,
              totalTiles: tiles.length,
          ''',
              '''      tilePlan: tiles,
              completedTiles: tiles.filter((tile) => tile.status === "stored").length,
              totalTiles: tiles.length,
          ''',
          )

          page_native = Path("src/capture/page-native-capture-engine.ts")
          text = page_native.read_text()
          helper = '''\nfunction throwIfImmediateCancellation(context: CaptureEngineContext): void {\n  if (!context.cancellation.cancelled || !context.cancellation.keepPartial) {\n    context.cancellation.throwIfCancelled("capture");\n  }\n}\n'''
          anchor = '''\nexport class PageNativeCaptureEngine implements CaptureEngine {\n'''
          if helper not in text:
              if anchor not in text:
                  raise SystemExit("Page-native helper anchor missing")
              text = text.replace(anchor, helper + anchor, 1)
          text = text.replace('context.cancellation.throwIfCancelled("capture");', 'throwIfImmediateCancellation(context);')
          boundary_old = '''        completedPages += 1;
            await context.reportProgress({
              jobId: context.jobId,
              state: "capturing",
              stage: "storing",
              completed: completedPages,
              total: documentPageMap.sourcePageCount,
              tileIndex: capturedPageTiles.at(-1)?.index,
            });
          }
          '''
          boundary_new = '''        completedPages += 1;
            await context.reportProgress({
              jobId: context.jobId,
              state: "capturing",
              stage: "storing",
              completed: completedPages,
              total: documentPageMap.sourcePageCount,
              tileIndex: capturedPageTiles.at(-1)?.index,
            });
            if (context.cancellation.cancelled) {
              context.cancellation.throwIfCancelled("capture");
            }
          }
          '''
          if boundary_new not in text:
              if boundary_old not in text:
                  raise SystemExit("Page boundary cancellation anchor missing")
              text = text.replace(boundary_old, boundary_new, 1)
          page_native.write_text(text)
          PY
      - name: Commit integration patch
        run: |
          if git diff --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/background/scroll-area-page-adapter.ts src/background/persistent-job-router.ts src/background/full-page-capture-coordinator.ts src/capture/page-native-capture-engine.ts
          git commit -m "Wire S31 page-native capture"
          git push origin HEAD:agent/s31-page-native-capture-v2

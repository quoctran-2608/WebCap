name: Format S25 settings E2E once

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: format-s25-settings-e2e-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  format:
    if: github.head_ref == 'agent/s25-settings-events-popup'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out S25 branch
        uses: actions/checkout@v4
        with:
          ref: agent/s25-settings-events-popup
          fetch-depth: 0
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Format and typecheck settings E2E
        run: |
          pnpm exec prettier --write tests/e2e/popup-settings.spec.ts
          pnpm lint
          pnpm typecheck
      - name: Commit formatted test and remove workflow
        run: |
          git rm .github/workflows/format-s25-settings-e2e-once.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/e2e/popup-settings.spec.ts
          git commit -m "Format persisted settings browser test"
          git push origin HEAD:agent/s25-settings-events-popup

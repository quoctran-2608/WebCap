name: S33 output recovery temp

on:
  push:
    branches: [agent/s33-recovery-quota-multipart-resilience]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/s33-recovery-quota-multipart-resilience
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: python scripts/s33_output_recovery_patch.py
      - run: >-
          pnpm exec prettier --write
          src/storage/pdf-output-spool.ts
          src/offscreen/streaming-pdf-writer.ts
          src/offscreen/streaming-pdf-exporter.ts
      - name: Validate output recovery core
        run: |
          pnpm typecheck
          pnpm exec vitest run tests/unit/streaming-pdf-writer.test.ts tests/unit/streaming-pdf-exporter.test.ts tests/unit/pdf-exporter.test.ts
      - run: rm -f scripts/s33_output_recovery_patch.py .github/workflows/s33-output-recovery-temp.yml
      - name: Commit output recovery
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m "Implement S33 durable streamed output recovery"
          git push origin HEAD:agent/s33-recovery-quota-multipart-resilience

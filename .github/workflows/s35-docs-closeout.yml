name: S35 Docs Closeout

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  docs:
    if: github.head_ref == 'agent/s35-pdf-ux-verification-rc'
    runs-on: ubuntu-latest
    steps:
      - name: Check out S35 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Close S35 documentation
        run: |
          python - <<'PY'
          from pathlib import Path

          run_id = "31258825875"
          package_bytes = "1,341,084"
          package_hash = "8bade485ee0672a2b160abf59f45c1772062ffc00724889c5aaa39294e7edb34"

          plan = Path("PLAN.md")
          text = plan.read_text()
          text = text.replace("date: 2026-08-06", "date: 2026-08-08", 1)
          text = text.replace("status: Release candidate complete", "status: PDF Engine V2 release candidate complete", 1)
          text = text.replace("current_session: S26-DONE", "current_session: S35-DONE", 1)
          marker = "S21–S26 đã hoàn tất roadmap 0.2.0: reset lifecycle, reliable selectors, adaptive/resumable capture, mode-aware output, stored settings, event-driven progress, release migration và reproducible RC. Artifact 0.1.0 vẫn được giữ nguyên và 0.2.0 chưa được xuất bản.\n"
          addition = f'''\n## PDF Engine V2 S27–S35\n\nRoadmap PDF Engine V2 đã hoàn tất trên cùng release candidate 0.2.0 mà không thêm backend, telemetry, cloud dependency, remote executable code, required permission hoặc default host permission. S35 là session cuối và `current_session` hiện là `S35-DONE`.\n\n| Session | Capability | Status |\n| --- | --- | --- |\n| S27 | Dedicated page-aware PDF capture | DONE |\n| S28 | PDF orchestration, manifest và strict completion contracts | DONE |\n| S29 | Streamed original-source acquisition | DONE |\n| S30 | Incremental/virtualized viewer intelligence | DONE |\n| S31 | Page-native capture và adaptive page batches | DONE |\n| S32 | OPFS spool và sequential streaming PDF writer | DONE |\n| S33 | Recovery, quota/backpressure và page-aligned multipart | DONE |\n| S34 | Difficult viewer/adversarial hardening | DONE |\n| S35 | Dedicated PDF UX, verification diagnostics, resume và RC polish | DONE |\n\nS35 clean read-only CI run `{run_id}` xác nhận 444/444 unit tests trên 127 files, 4/4 PDF benchmarks, 56/56 Playwright E2E trên Chrome for Testing 151.0.7922.34, reproducible `webcap-0.2.0.zip` ({package_bytes} bytes, 25 entries, SHA-256 `{package_hash}`) và packaged lifecycle gồm clean install, `0.1.0 → 0.2.0` state preservation và uninstall. Dependency audit vẫn báo đúng 1 high-severity advisory nhưng không có critical finding chặn CI.\n\nTraceability PDF Engine V2 nằm tại `docs/release/acceptance-criteria-pdf-engine-v2.md`. Không có tag, GitHub Release hoặc Chrome Web Store submission trong S35.\n'''
          assert marker in text and "## PDF Engine V2 S27–S35" not in text
          plan.write_text(text.replace(marker, marker + addition))

          readme = Path("README.md")
          text = readme.read_text()
          marker = "**WebCap 0.2.0 release candidate is complete and ready for review.** S21–S25 delivered reset, reliable selectors, adaptive capture, automatic mode-aware output, stored settings and event-driven popup progress. S26 bumps the package to 0.2.0, validates upgrade from 0.1.0, adds previous-stable Chrome coverage, closes the gap audit and prepares a reproducible local-first release candidate without publishing it.\n"
          addition = f'''\n**PDF Engine V2 S27–S35 is complete and ready for release-owner review.** The engine now prefers byte-preserved original PDFs when safely available, discovers virtualized viewers incrementally, captures verified logical pages page-by-page, streams raster output to OPFS, resumes at durable page/writer checkpoints, handles storage pressure with page-aligned multipart fallback, hardens difficult viewers, and surfaces page-first verified UX plus bounded diagnostics. S35 clean read-only CI run `{run_id}` passed 444/444 unit tests, 4/4 PDF benchmarks, 56/56 Playwright E2E and packaged lifecycle; the reproducible 25-entry `webcap-0.2.0.zip` is {package_bytes} bytes with SHA-256 `{package_hash}`. No publication action has been performed.\n'''
          assert marker in text and "**PDF Engine V2 S27–S35 is complete" not in text
          text = text.replace(marker, marker + addition)
          text = text.replace("## 0.2.0 outcomes and remaining work", "## 0.2.0 and PDF Engine V2 outcomes", 1)
          outcome_marker = "- No backend, telemetry, remote executable code, new required permission or default host permission.\n"
          outcome_addition = '''- Delivered in S27–S35: first-class PDF strategy negotiation, streamed original-source acquisition, virtualized viewer discovery, page-native bounded capture, OPFS streaming output, recovery/quota/multipart resilience, difficult-viewer hardening, page-first verified UX and content-free diagnostics.\n- S35 keeps legacy/pre-manifest jobs backward compatible by falling back to durable job page/export progress without rewriting existing IndexedDB records.\n'''
          assert outcome_marker in text
          readme.write_text(text.replace(outcome_marker, outcome_marker + outcome_addition, 1))

          changelog = Path("CHANGELOG.md")
          text = changelog.read_text()
          marker = "## [Unreleased]\n"
          addition = f'''\n### Added\n\n- PDF Engine V2 S27–S35: page-aware PDF capture, dedicated orchestration and completion evidence, streamed original-source acquisition, incremental virtualized-viewer discovery, page-native adaptive batches, OPFS sequential PDF writing, restart/quota/multipart resilience, difficult-viewer hardening, and dedicated page-first PDF UX.\n- S35 metadata-only `PDF_MANIFEST_GET` and retryable `JOB_RESUME` routing, verified rendered-view result copy, legacy manifest fallback, and bounded diagnostics for strategy/adapter bucket/page counters without page content, URLs, filenames or titles.\n- S35 browser regression ties the user-facing verified label to a real three-page mixed-orientation artifact and exact durable manifest evidence.\n- S35 clean read-only CI run `{run_id}`: 444/444 unit tests across 127 files, 4/4 PDF benchmarks, 56/56 Playwright E2E on Chrome 151.0.7922.34, packaged `0.1.0 → 0.2.0` lifecycle PASS, reproducible `webcap-0.2.0.zip` ({package_bytes} bytes, 25 entries, SHA-256 `{package_hash}`). Security gate passes its configured critical threshold; `pnpm audit` reports one high-severity advisory and no critical blocker.\n'''
          assert marker in text and "PDF Engine V2 S27–S35" not in text.split("## [0.2.0]", 1)[0]
          changelog.write_text(text.replace(marker, marker + addition, 1))

          Path("docs/release/0.2.0.md").write_text(f'''# WebCap 0.2.0 release-candidate notes\n\nDate: 2026-08-08  \nStatus: PDF Engine V2 release candidate complete; ready for release-owner review\n\n## Highlights\n\n- S21–S26: capture reset, reliable region drawing, adaptive/resumable full-page capture, automatic mode-aware output, stored settings, event-driven progress, simplified popup, migration and release hardening.\n- S27–S28: page-aware PDF capture plus a dedicated `PdfDocumentManifest`, orchestrator and strict source/output completion boundary.\n- S29–S30: streamed byte-preserved original-source acquisition plus incremental PDF viewer discovery for semantic, shadow-root, virtualized/recycled and guarded canvas-only viewers.\n- S31–S32: page-native adaptive capture, page-local tiling, OPFS output spool and sequential streaming PDF writer with durable page checkpoints.\n- S33–S34: service-worker/offscreen recovery, storage backpressure, resumable pause, page-aligned multipart output, ownership cleanup and difficult-viewer/adversarial hardening.\n- S35: dedicated PDF suggestion/result/progress UX, strict verified completion surfacing, retryable resume, bounded content-free PDF diagnostics and backward-compatible legacy manifest fallback.\n\n## Final S35 release evidence\n\n- Clean read-only CI run `{run_id}`: PASS.\n- Formatting, ESLint, strict TypeScript, privacy/dependency/release audits: PASS.\n- Configured critical dependency gate: PASS; `pnpm audit` reports one high-severity advisory and no critical finding.\n- Unit suite: **444/444** across **127/127** test files.\n- PDF performance benchmark: **4/4 PASS**.\n- Manifest V3 production build: PASS.\n- Reproducible package: `webcap-0.2.0.zip`, **{package_bytes} bytes**, **25 entries**, SHA-256 `{package_hash}`.\n- Playwright extension E2E: **56/56 PASS** on Chrome for Testing `151.0.7922.34`, including S29 original-source, S30 500-page virtualized discovery, S33 recovery, S34 adversarial viewer and S35 verified `3/3` page UX.\n- Packaged lifecycle: PASS for clean install, stable extension ID, `0.1.0 → 0.2.0` settings/locale/unrelated-state preservation, popup preference initialization and uninstall.\n\n## Boundaries\n\nNo backend, telemetry, analytics, remote executable code, new required permission or default host permission. S35 does not create a tag, GitHub Release, Chrome Web Store upload, review submission or publication.\n''')

          Path("docs/s35-pdf-ux-verification-release-candidate.md").write_text(f'''# S35 — Dedicated PDF UX, verification and release candidate\n\nStatus: COMPLETE\n\nBaseline: `main` after S34 merge commit `4e225bf5f1b0dc1737fa663cb2c78786c8af7b73`.\n\nS35 closes PDF Engine V2 by surfacing the durable page-oriented evidence from S28–S34 as user-facing UX without weakening any engine invariant.\n\n## Delivered\n\n- dedicated rendered-PDF suggestion when original-source acquisition is unavailable but the visible viewer remains capturable;\n- page-first capture, verification, streamed-writer, pause and completed states in the popup;\n- metadata-only `PDF_MANIFEST_GET` and retryable `JOB_RESUME` handled by a dedicated router;\n- routing ownership guard so the generic background router cannot consume S35 requests;\n- S33 recovery reuse for paused page-native capture and paused streamed PDF output;\n- verified result labeling only from a completed durable manifest with exact discovered/captured/verified/output agreement;\n- bounded diagnostics containing only strategy, manifest state, viewer-adapter bucket and page counters;\n- backward compatibility for pre-manifest jobs through durable `CaptureJob` progress without data migration;\n- real-browser validation that a three-page mixed-orientation viewer produces a valid three-page PDF and then renders `3/3 trang đã xác minh`;\n- AC-41–AC-60 traceability in `docs/release/acceptance-criteria-pdf-engine-v2.md`.\n\n## Validation — clean read-only CI `{run_id}`\n\n- Prettier: PASS.\n- ESLint: PASS.\n- strict TypeScript: PASS.\n- privacy/dependency/release audits: PASS.\n- configured critical dependency gate: PASS; one high-severity advisory remains, with no critical blocker.\n- unit tests: **444/444** across **127/127** files.\n- PDF performance benchmarks: **4/4 PASS**.\n- Manifest V3 build: PASS.\n- reproducible package: `webcap-0.2.0.zip`, **{package_bytes} bytes**, 25 entries, SHA-256 `{package_hash}`.\n- Playwright extension E2E: **56/56 PASS** on Chrome for Testing `151.0.7922.34`.\n- S35 verified viewer UX regression: PASS.\n- S34 difficult-viewer/adversarial fixture: PASS.\n- S33 forced service-worker/offscreen recovery regressions: PASS.\n- S30 500-page virtualized viewer regression: PASS.\n- S29 byte-identical original-source regression: PASS.\n- packaged lifecycle: PASS, including clean install, `0.1.0 → 0.2.0` state preservation and uninstall.\n\n## Invariants and publication boundary\n\n- S28–S34 correctness remains authoritative; S35 only surfaces durable evidence.\n- `100%`/verified result is never inferred from tile completion alone.\n- No IndexedDB schema migration is introduced by S35.\n- No new required Chrome permission, backend, telemetry, account, cloud dependency or remote executable code is introduced.\n- No tag, GitHub Release or Chrome Web Store action is included.\n''')

          Path("docs/s35-validation-checklist.md").write_text(f'''# S35 validation checklist\n\n- [x] Prettier\n- [x] ESLint\n- [x] strict TypeScript\n- [x] privacy/dependency/release audits\n- [x] critical dependency gate — one high advisory, no critical blocker\n- [x] full unit suite — 444/444 across 127 files\n- [x] S35 PDF UX/protocol/router focused tests\n- [x] 4/4 PDF benchmarks\n- [x] Manifest V3 build\n- [x] reproducible package verification — {package_bytes} bytes, SHA-256 `{package_hash}`\n- [x] 56/56 Playwright extension E2E\n- [x] S35 verified 3/3 page UX regression\n- [x] S29 original-source regression\n- [x] S30 virtualized viewer regression\n- [x] S33 service-worker/offscreen recovery regressions\n- [x] S34 difficult-viewer/adversarial regression\n- [x] packaged clean install / 0.1.0 -> 0.2.0 update / uninstall\n\nEvidence: clean read-only CI run `{run_id}`.\n\nPublication boundary: no tag, GitHub Release or Chrome Web Store action in S35 without separate explicit approval.\n''')

          Path("docs/release/acceptance-criteria-pdf-engine-v2.md").write_text(f'''# PDF Engine V2 acceptance criteria — AC-41–AC-60\n\nStatus: PASS  \nFinal S35 evidence: clean read-only CI run `{run_id}` on the S35 candidate.\n\n| AC | Requirement | Disposition | Primary evidence |\n| --- | --- | --- | --- |\n| AC-41 | Dedicated PDF orchestrator and page-oriented state model | PASS | S28 `PdfCaptureOrchestrator` + durable `PdfDocumentManifest` |\n| AC-42 | Preserve original PDF bytes when safely accessible | PASS | S29 source acquisition + byte-identical browser regression |\n| AC-43 | Stream large original source without whole-file RAM buffering | PASS | S29 OPFS streamed acquisition + incremental signature/hash verification |\n| AC-44 | No normal document-wide tile-count completion limit for PDF viewer capture | PASS | S31 page-native planning/batching |\n| AC-45 | Incremental discovery for virtualized/recycled viewers | PASS | S30 500-page virtualized Chromium regression |\n| AC-46 | One source page produces exactly one output page | PASS | S27–S32 page map/orchestrator/writer invariants + mixed-orientation E2E |\n| AC-47 | Preserve mixed page sizes and orientation independently | PASS | S30 discovery, S31 capture and S32 writer coverage |\n| AC-48 | One giant page can tile internally without a full-document canvas | PASS | S31 page-local tile planner and safety budget |\n| AC-49 | Raster memory bounded by current page/batch, not document length | PASS | S31 page-native capture + S32 sequential OPFS writer |\n| AC-50 | Storage pressure shrinks/pauses work without corrupt completion | PASS | S33 storage-pressure controller and pause semantics |\n| AC-51 | Service-worker restart resumes without recapturing verified pages | PASS | S33 forced service-worker recovery browser regression |\n| AC-52 | Offscreen/output restart resumes from durable writer checkpoint | PASS | S33 forced offscreen recovery browser regression |\n| AC-53 | Auth/encrypted/unavailable source safely falls back to visible viewer capture | PASS | S29 acquisition fallback + S34 compatibility revalidation |\n| AC-54 | Blank and duplicate-looking adjacent pages remain distinct | PASS | S34 adversarial browser fixture |\n| AC-55 | Viewer chrome, gutters and inter-page gaps are excluded | PASS | S27 page rectangle cropping + page-aware output regression |\n| AC-56 | Stop/partial output ends on complete source-page boundaries | PASS | S31 page-boundary stop + S33 recovery semantics |\n| AC-57 | Multipart fallback splits only between source pages | PASS | S33 multipart contract/planner/byte regression |\n| AC-58 | Completed/100% requires strict discovered/captured/verified/output agreement | PASS | S28 completion evidence + S35 verified UX tied to durable manifest |\n| AC-59 | Diagnostics expose bounded content-free PDF metadata only | PASS | S35 safe diagnostics allowlist and redaction tests |\n| AC-60 | No new required permission/backend/telemetry/cloud dependency | PASS | Manifest/privacy/release audits through S35 |\n\n## Final gate\n\n- Unit: **444/444** across **127/127** files.\n- PDF benchmarks: **4/4 PASS**.\n- Playwright: **56/56 PASS** on Chrome for Testing `151.0.7922.34`.\n- Reproducible package: `webcap-0.2.0.zip`, **{package_bytes} bytes**, 25 entries, SHA-256 `{package_hash}`.\n- Packaged lifecycle: clean install, stable ID, `0.1.0 → 0.2.0` state preservation and uninstall PASS.\n- Security threshold: PASS; one high-severity dependency advisory remains and no critical finding blocks CI.\n\nNo tag, GitHub Release or Chrome Web Store submission/publication has been performed.\n''')
          PY
      - name: Format documentation
        run: pnpm exec prettier --write PLAN.md README.md CHANGELOG.md docs/release/0.2.0.md docs/s35-pdf-ux-verification-release-candidate.md docs/s35-validation-checklist.md docs/release/acceptance-criteria-pdf-engine-v2.md
      - name: Commit documentation closeout
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PLAN.md README.md CHANGELOG.md docs/release/0.2.0.md docs/s35-pdf-ux-verification-release-candidate.md docs/s35-validation-checklist.md docs/release/acceptance-criteria-pdf-engine-v2.md
          git commit -m "Complete S35 release candidate documentation"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

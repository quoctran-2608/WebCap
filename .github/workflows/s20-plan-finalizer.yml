name: S20 Plan Finalizer

# Temporary asserted migration; remove after PLAN.md is committed.
on:
  push:
    branches:
      - agent/s20-release-candidate
    paths:
      - ".github/workflows/s20-plan-finalizer.yml"

permissions:
  contents: write

concurrency:
  group: s20-plan-finalizer
  cancel-in-progress: false

jobs:
  finalize-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out release branch
        uses: actions/checkout@v4
        with:
          ref: agent/s20-release-candidate
          fetch-depth: 0

      - name: Finalize PLAN.md with asserted replacements
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("PLAN.md")
          text = path.read_text(encoding="utf-8")

          def replace_once(old: str, new: str) -> None:
              global text
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"Expected exactly one PLAN.md match, found {count}: {old[:80]!r}")
              text = text.replace(old, new, 1)

          replace_once("status: Active", "status: Complete")
          replace_once("current_session: S20", "current_session: COMPLETE")
          replace_once(
              "| S20 | M6 | Release candidate, packaging và store readiness | S19 | 18k–26k | NEXT |",
              "| S20 | M6 | Release candidate, packaging và store readiness | S19 | 18k–26k | DONE |",
          )
          replace_once(
              "**Commit gợi ý:** `Prepare WebCap release candidate`.\n\n# 8. Quality gates theo giai đoạn",
              """**Commit gợi ý:** `Prepare WebCap release candidate`.

**Hoàn thành:** 2026-08-04 · PR #24 · validation head `3fb083fc` · CI `30909732983` · Release Candidate `30909732939`.

**Ghi chú kỹ thuật:** deterministic ZIP 24 entry được tạo hai lần byte-identical, kích thước 1.097.035 byte và SHA-256 `630c44c07e72da0d5edc1c82c013ecf6caf995e0542ee19679380081e7b0cb7a`; manifest/package cùng version 0.1.0 và minimum Chrome 116. Clean-profile lifecycle xác thực cài mới, không có host permission mặc định, update fixture 0.0.9→0.1.0 giữ extension ID/`chrome.storage.local`, self-uninstall và relaunch không còn extension trên Linux, Windows, macOS, Chrome 116.0.5845.96 và Chrome stable 151.0.7922.71. Gate cuối pass format, lint, strict typecheck, privacy/license/release/critical-security audit, 279 unit tests/79 files, bốn PDF benchmark, Manifest V3 build và 38 Playwright E2E gồm DPR 1/1,5/2 × zoom 80/100/125/150%; toàn bộ MUST AC pass, không có P0/P1 hoặc critical advisory. Workflow chỉ tạo artifact; chưa tạo tag/release hoặc submit Chrome Web Store.

# 8. Quality gates theo giai đoạn""",
          )
          replace_once(
              "| S20 | NEXT | — | — | — | Sẵn sàng tạo release candidate, deterministic ZIP, clean-profile lifecycle checks và store-readiness hồ sơ; không thêm tính năng mới. |",
              "| S20 | DONE | 2026-08-04 | PR #24 / validation `3fb083fc` / CI `30909732983` / RC `30909732939` | format, lint, typecheck, privacy/license/release/security audit, 279 unit, 4 PDF benchmarks, build, 38 Playwright E2E, packaged lifecycle Linux/Windows/macOS + Chrome 116/stable | ZIP deterministic 24 entry SHA-256 `630c44c…`, clean install/update/storage/uninstall, toàn bộ MUST AC và store-readiness docs đã được xác thực; không publish. |",
          )
          replace_once(
              """# 12. Lệnh bắt đầu lần triển khai kế tiếp

Session kế tiếp là **S20 — Release candidate, packaging và store readiness**.

Khi được yêu cầu tiếp tục code, tôi phải:

1. Đọc `PLAN.md` phần S20 và toàn bộ exit criteria/Definition of Done liên quan trong PRD/SPEC.
2. Kiểm tra repo, branch, dependency alerts, PR và kết quả CI read-only của S19.
3. Chỉ triển khai S20; không thêm capability mới hoặc mở rộng MVP.
4. Chạy full selected quality suite, tạo production build và deterministic ZIP, audit manifest/version/permissions, rồi kiểm tra install/update/uninstall trên clean profile.
5. Hoàn thiện release checklist, known limitations, privacy/store copy, CHANGELOG, version/checksum và triage mọi P0/P1/critical alert.
6. Chuẩn bị tag/release workflow nhưng không publish Chrome Web Store khi chưa có chỉ thị cụ thể.""",
              """# 12. Trạng thái sau S20

Kế hoạch MVP `S00–S20` đã hoàn thành. Không có session triển khai kế tiếp được lên lịch trong tài liệu này.

Các bước tiếp theo chỉ được thực hiện khi có quyết định sản phẩm/phát hành rõ ràng:

1. Muốn submit Chrome Web Store: hoàn tất các owner action còn mở trong `docs/release-checklist.md`, dùng đúng ZIP/checksum đã xác thực và chỉ submit sau phê duyệt phát hành cụ thể.
2. Muốn thay đổi code/package sau RC 0.1.0: cập nhật PRD/SPEC khi cần, mở session/version mới có phạm vi riêng, tăng manifest/package version nếu artifact đã được upload lên store, rồi chạy lại toàn bộ release gate.
3. Muốn tạo tag hoặc GitHub Release: dùng commit đã merge và artifact tái tạo từ workflow read-only; không gắn tag vào một artifact chưa qua gate.
4. Không tự động publish, bật automatic publication, thêm telemetry/backend/permission hoặc mở rộng MVP chỉ vì kế hoạch S00–S20 đã hoàn tất.""",
          )

          path.write_text(text, encoding="utf-8")
          PY
          git diff --check -- PLAN.md
          grep -q '^status: Complete$' PLAN.md
          grep -q '^current_session: COMPLETE$' PLAN.md
          grep -q '| S20 | DONE | 2026-08-04 | PR #24' PLAN.md

      - name: Commit finalized plan
        shell: bash
        run: |
          git config user.name "webcap-release-bot"
          git config user.email "webcap-release-bot@users.noreply.github.com"
          git add PLAN.md
          git diff --cached --quiet && exit 0
          git commit -m "Finalize S20 implementation plan"
          git push origin HEAD:agent/s20-release-candidate

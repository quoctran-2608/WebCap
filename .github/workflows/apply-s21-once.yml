name: Apply S21 implementation once

on:
  push:
    branches:
      - agent/s21-capture-reset
    paths:
      - .github/workflows/apply-s21-once.yml
      - .github/s21.patch.gz.b64

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out S21 branch
        uses: actions/checkout@v4
        with:
          ref: agent/s21-capture-reset
          fetch-depth: 0

      - name: Decode and apply patch
        run: |
          base64 --decode .github/s21.patch.gz.b64 | gzip --decompress > /tmp/s21.patch
          git apply --index /tmp/s21.patch
          rm .github/s21.patch.gz.b64 .github/workflows/apply-s21-once.yml
          git add -A

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format implementation
        run: pnpm format

      - name: Validate TypeScript and lint
        run: |
          pnpm typecheck
          pnpm lint

      - name: Run unit tests
        run: pnpm test:unit

      - name: Verify production build
        run: pnpm build

      - name: Commit validated implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Implement S21 capture reset lifecycle"
          git push origin HEAD:agent/s21-capture-reset

# Triggered after the workflow was registered on the branch.

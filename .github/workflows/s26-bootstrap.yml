name: S26 Bootstrap

on:
  push:
    branches: [agent/s26-hardening-rc]
    paths:
      - ".github/workflows/s26-bootstrap.yml"
      - "scripts/s26-bootstrap.mjs"

permissions:
  contents: write

concurrency:
  group: s26-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  implement-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out S26 branch
        uses: actions/checkout@v4
        with:
          ref: agent/s26-hardening-rc
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Apply S26 changes
        run: node scripts/s26-bootstrap.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format S26 changes
        run: pnpm format

      - name: Check formatting
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Privacy, dependency, release, and critical-security audits
        run: pnpm run audit && pnpm audit:security

      - name: Unit tests
        run: pnpm test:unit

      - name: PDF performance benchmarks
        run: pnpm benchmark:pdf

      - name: Build extension
        run: pnpm build

      - name: Reproduce and verify release package
        run: node scripts/verify-reproducible-package.mjs

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Full extension E2E
        run: pnpm test:e2e

      - name: Packaged 0.1.0 to 0.2.0 lifecycle
        run: pnpm test:release

      - name: Record S26 implementation evidence
        run: node scripts/s26-bootstrap.mjs --record-evidence

      - name: Final formatting and diff checks
        run: |
          pnpm format
          pnpm format:check
          git diff --check

      - name: Remove temporary bootstrap files
        run: rm .github/workflows/s26-bootstrap.yml scripts/s26-bootstrap.mjs

      - name: Commit validated S26 implementation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare WebCap 0.2.0 release candidate"
          git push origin HEAD:agent/s26-hardening-rc

      - name: Upload implementation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: s26-bootstrap-${{ github.sha }}
          path: |
            artifacts/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

name: S26 Migration Fix

on:
  push:
    branches: [agent/s26-hardening-rc]
    paths:
      - ".github/workflows/s26-bootstrap.yml"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/s26-bootstrap.yml"

permissions:
  contents: write

concurrency:
  group: s26-migration-fix
  cancel-in-progress: true

jobs:
  fix-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Check out latest S26 branch
        uses: actions/checkout@v4
        with:
          ref: agent/s26-hardening-rc
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Replace order-sensitive migration assertion
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("tests/release/packaged-lifecycle.mjs")
          content = path.read_text()
          start_marker = "    if (JSON.stringify(migration.settings) !== JSON.stringify(legacySettings)) {"
          end_marker = "    if (migration.locale?.schemaVersion !== 1 || migration.locale?.locale !== \"en\") {"
          start = content.find(start_marker)
          end = content.find(end_marker, start)
          if start < 0 or end < 0:
              raise SystemExit("Migration assertion boundaries were not found")
          replacement = '''    const migratedSettings = migration.settings;
            if (
              migratedSettings?.schemaVersion !== 1 ||
              migratedSettings.settings?.outputFormat !== "webp" ||
              migratedSettings.settings?.imageQuality !== 0.82 ||
              migratedSettings.settings?.fixedElementMode !== "remove" ||
              migratedSettings.settings?.lazyLoad?.enabled !== true ||
              migratedSettings.settings?.lazyLoad?.stepRatio !== 0.8 ||
              migratedSettings.settings?.lazyLoad?.settleMs !== 250 ||
              migratedSettings.settings?.lazyLoad?.maxDurationMs !== 15_000 ||
              migratedSettings.settings?.limits?.maxCssHeight !== 100_000 ||
              migratedSettings.settings?.limits?.maxCssWidth !== 32_768 ||
              migratedSettings.settings?.limits?.maxTiles !== 256 ||
              migratedSettings.settings?.limits?.maxEstimatedBytes !== 512 * 1024 * 1024 ||
              migratedSettings.settings?.pdf?.pageSize !== "letter" ||
              migratedSettings.settings?.pdf?.orientation !== "landscape" ||
              migratedSettings.settings?.pdf?.marginMm !== 12 ||
              migratedSettings.settings?.pdf?.jpegQuality !== 0.78
            ) {
              throw new Error(
                `WebCap 0.1.0 capture settings were not preserved during update: ${JSON.stringify(migratedSettings)}.`,
              );
            }
            '''
          path.write_text(content[:start] + replacement + content[end:])
          PY

      - name: Install dependencies and Chromium
        run: |
          pnpm install --frozen-lockfile
          pnpm exec playwright install --with-deps chromium

      - name: Format test and verify package lifecycle
        run: |
          pnpm exec prettier --write tests/release/packaged-lifecycle.mjs
          pnpm package
          pnpm test:release

      - name: Commit validated assertion
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/release/packaged-lifecycle.mjs
          git commit -m "Validate WebCap 0.1.0 settings migration semantically"
          git push origin HEAD:agent/s26-hardening-rc

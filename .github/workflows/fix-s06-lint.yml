name: Fix S06 lint

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: fix-s06-lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out S06 branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Remove unused mock parameters
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("tests/unit/job-coordinator.test.ts")
          text = path.read_text(encoding="utf-8")
          replacements = {
              'import type { JobSummary, StoredTileRecord, TabJobLock } from "@shared/contracts/job";': 'import type { JobSummary, TabJobLock } from "@shared/contracts/job";',
              '  put(_record: StoredTileRecord): Promise<void> {': '  put(): Promise<void> {',
              '  get(_jobId: string, _index: number): Promise<StoredTileRecord | undefined> {': '  get(): Promise<undefined> {',
              '  listByJob(_jobId: string): Promise<StoredTileRecord[]> {': '  listByJob(): Promise<[]> {',
          }
          for old, new in replacements.items():
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"expected one match, found {count}: {old}")
              text = text.replace(old, new)
          path.write_text(text, encoding="utf-8")
          PY
          pnpm format
          pnpm lint

      - name: Commit lint fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "Fix persistent job lint boundaries"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}

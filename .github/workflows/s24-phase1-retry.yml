name: Apply Corrected S24 Phase 1

on:
  push:
    branches: [agent/s24-auto-output]

permissions:
  contents: write

concurrency:
  group: s24-phase1-retry
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out S24 branch
        uses: actions/checkout@v4
        with:
          ref: agent/s24-auto-output
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply, validate, and publish a clean result
        shell: bash
        run: |
          set +e
          : > /tmp/s24-phase1.log

          python scripts/s24-phase1-apply.py >> /tmp/s24-phase1.log 2>&1
          status=$?

          if [ "$status" -eq 0 ]; then
            pnpm exec prettier --write \
              src/offscreen/tiled-image-exporter.ts \
              src/shared/errors/error.ts \
              src/shared/i18n.ts \
              src/shared/contracts/offscreen.ts \
              src/background/offscreen-service.ts \
              src/offscreen/entry.ts \
              tests/unit/tiled-image-exporter.test.ts >> /tmp/s24-phase1.log 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then pnpm lint >> /tmp/s24-phase1.log 2>&1; status=$?; fi
          if [ "$status" -eq 0 ]; then pnpm typecheck >> /tmp/s24-phase1.log 2>&1; status=$?; fi
          if [ "$status" -eq 0 ]; then pnpm test:unit >> /tmp/s24-phase1.log 2>&1; status=$?; fi
          if [ "$status" -eq 0 ]; then pnpm build >> /tmp/s24-phase1.log 2>&1; status=$?; fi

          git config user.name "OpenAI coding agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$status" -eq 0 ]; then
            rm scripts/s24-phase1-apply.py .github/workflows/s24-phase1-retry.yml
            git add \
              src/offscreen/tiled-image-exporter.ts \
              src/shared/errors/error.ts \
              src/shared/i18n.ts \
              src/shared/contracts/offscreen.ts \
              src/background/offscreen-service.ts \
              src/offscreen/entry.ts \
              tests/unit/tiled-image-exporter.test.ts \
              scripts/s24-phase1-apply.py \
              .github/workflows/s24-phase1-retry.yml
            git commit -m "Add guarded tiled image export pipeline"
          else
            git reset --hard HEAD
            mkdir -p docs/sessions
            {
              echo '# S24 phase 1 diagnostic'
              echo
              echo "Exit status: $status"
              echo
              echo '```text'
              tail -c 50000 /tmp/s24-phase1.log
              echo
              echo '```'
            } > docs/sessions/s24-phase1-diagnostic.md
            rm scripts/s24-phase1-apply.py .github/workflows/s24-phase1-retry.yml
            git add \
              docs/sessions/s24-phase1-diagnostic.md \
              scripts/s24-phase1-apply.py \
              .github/workflows/s24-phase1-retry.yml
            git commit -m "Record S24 phase 1 validation failure"
          fi

          git push origin HEAD:agent/s24-auto-output

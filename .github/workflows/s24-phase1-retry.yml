name: Apply Corrected S24 Phase 1

on:
  push:
    branches: [agent/s24-auto-output]

permissions:
  contents: write

concurrency:
  group: s24-phase1-retry
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out S24 branch
        uses: actions/checkout@v4
        with:
          ref: agent/s24-auto-output
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply phase 1 patch
        run: python scripts/s24-phase1-apply.py

      - name: Format phase 1 files
        run: |
          pnpm exec prettier --write \
            src/offscreen/tiled-image-exporter.ts \
            src/shared/errors/error.ts \
            src/shared/i18n.ts \
            src/shared/contracts/offscreen.ts \
            src/background/offscreen-service.ts \
            src/offscreen/entry.ts \
            tests/unit/tiled-image-exporter.test.ts

      - name: Validate phase 1
        run: |
          pnpm lint
          pnpm typecheck
          pnpm test:unit
          pnpm build

      - name: Commit clean phase 1
        run: |
          rm scripts/s24-phase1-apply.py .github/workflows/s24-phase1-retry.yml
          git config user.name "OpenAI coding agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            src/offscreen/tiled-image-exporter.ts \
            src/shared/errors/error.ts \
            src/shared/i18n.ts \
            src/shared/contracts/offscreen.ts \
            src/background/offscreen-service.ts \
            src/offscreen/entry.ts \
            tests/unit/tiled-image-exporter.test.ts \
            scripts/s24-phase1-apply.py \
            .github/workflows/s24-phase1-retry.yml
          git commit -m "Add guarded tiled image export pipeline"
          git push origin HEAD:agent/s24-auto-output

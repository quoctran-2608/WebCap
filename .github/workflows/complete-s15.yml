name: Complete S15 documentation

on:
  push:
    branches: [agent/s15-pdf-benchmarks]

permissions:
  contents: write

concurrency:
  group: complete-s15
  cancel-in-progress: false

jobs:
  complete:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out S15 branch
        uses: actions/checkout@v4
        with:
          ref: agent/s15-pdf-benchmarks
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Update S15 completion documents
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_exact(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"Expected text not found in {path}: {old[:80]!r}")
              file.write_text(text.replace(old, new, 1))

          replace_exact(
              "README.md",
              "**S14 — PDF editor, options, and non-destructive retry are implemented.** A ready tiled capture can now open a dedicated React editor routed by job ID. The editor restores a persistent edit manifest after reload, lazy-loads page thumbnails from local source tiles, supports logical page removal and keyboard-accessible reordering, and exposes A4, Letter, fit-width, portrait/landscape, margin, and JPEG-quality settings with an explicitly approximate size estimate. Export uses the S13 page-at-a-time pipeline, reports per-page progress, supports cooperative cancellation and retry without recapturing, and downloads the completed local PDF artifact. Source tiles remain immutable and reusable; thumbnails and PDF bytes stay as IndexedDB Blob values rather than crossing runtime messages. S15 remains responsible for 10k/30k/100k PDF benchmarks, integrity checks, and memory guardrails.",
              "**S15 — PDF benchmarks, integrity validation, and memory guards are complete.** WebCap now validates 1,440 × 10k, 30k, and 100k CSS-pixel captures plus a 4,096 × 30k wide case through a repeatable CI benchmark. The exporter estimates its page-at-a-time working set before allocating a PDF document or canvas, fails unsafe requests with retryable `E_MEMORY_GUARD`, and offers lower-quality, A4/Letter multi-page, or smaller-batch alternatives without deleting source tiles. Every generated PDF is checked for signature, loadability, exact page count, page dimensions, image-backed non-empty streams, and artifact persistence only after integrity passes. The reference run preserves one decoded tile at a time, passes 239 unit tests and 20 Playwright cases, and retains local `pdf-lib` 1.17.1. S16 is next: scrollable-container detection and complete internal-scroll capture.",
          )
          replace_exact(
              "README.md",
              "pnpm test:unit     # Run the unit-test suite once.\n",
              "pnpm test:unit     # Run the unit-test suite once.\npnpm benchmark:pdf # Run the deterministic long-page PDF benchmark suite.\n",
          )

          changelog = Path("CHANGELOG.md")
          changelog_text = changelog.read_text()
          marker = "### Added\n\n"
          if marker not in changelog_text:
              raise SystemExit("CHANGELOG Added marker not found")
          bullets = """- Fail-fast PDF memory estimation using page RGBA, one decoded tile, encoded-page allowance, fixed exporter overhead, runtime heap budget, and independent total-pixel/tile-count/tile-byte guardrails.
          - Retryable `E_MEMORY_GUARD` recovery guidance for lower JPEG quality, A4/Letter multi-page output, and smaller page batches while preserving every source tile.
          - Pre-persistence PDF integrity validation for signature, `pdf-lib` loadability, exact page count, page dimensions, image-backed streams, and corrupt-output rejection.
          - Export diagnostics for elapsed duration, artifact bytes, maximum decoded-tile concurrency, maximum page-canvas area, estimated working set, and best-effort heap evidence.
          - Dedicated CI benchmark scenarios for 1,440 × 10k, 30k, and 100k CSS pixels plus a 4,096 × 30k wide page, with machine-readable JSON output and documented synthetic-versus-browser boundaries.
          - The S15 reference suite passes 239 unit tests across 66 files, four PDF benchmark cases, a verified extension build, and 20 Playwright E2E cases.
          """
          changelog.write_text(changelog_text.replace(marker, marker + bullets, 1))

          replace_exact("PLAN.md", "current_session: S15", "current_session: S16")
          replace_exact(
              "PLAN.md",
              "| S15 | M4 | PDF benchmarks, integrity và memory guards | S14 | 18k–26k | NEXT |\n| S16 | M5 | Scrollable-container detection và capture | S15 | 22k–30k | READY |",
              "| S15 | M4 | PDF benchmarks, integrity và memory guards | S14 | 18k–26k | DONE |\n| S16 | M5 | Scrollable-container detection và capture | S15 | 22k–30k | NEXT |",
          )
          replace_exact(
              "PLAN.md",
              "| S15 | NEXT | — | — | — | Sẵn sàng benchmark PDF 10k/30k/100k, kiểm tra integrity và memory guard. |\n| S16 | READY | — | — | — | — |",
              "| S15 | DONE | 2026-08-04 | PR #19 / CI 30871783639 | format, lint, typecheck, 239 unit, 4 PDF benchmark, build, 20 Playwright E2E | Guard chạy trước allocation, integrity chạy trước persistence, max decoded concurrency bằng 1, source tiles được giữ khi lỗi và 10k/30k/100k/wide benchmark đã được xác thực. |\n| S16 | NEXT | — | — | — | Sẵn sàng triển khai scrollable-container detection và capture toàn bộ nội dung cuộn nội bộ. |",
          )
          replace_exact(
              "PLAN.md",
              "Session kế tiếp là **S15 — PDF benchmarks, integrity và memory guards**.\n\nKhi được yêu cầu tiếp tục code, tôi phải:\n\n1. Đọc `PLAN.md` phần S15.\n2. Đọc SPEC §21–22, §27.5, TV-01/TV-02 và NFR PDF liên quan trong PRD.\n3. Kiểm tra repo/branch và kết quả CI S14.\n4. Chỉ triển khai S15.\n5. Kết thúc với benchmark repeatable 10k/30k/100k, PDF integrity checker, decoded-concurrency/heap evidence, memory guard có phương án thay thế và `docs/benchmarks.md`.",
              "Session kế tiếp là **S16 — Scrollable-container detection và capture**.\n\nKhi được yêu cầu tiếp tục code, tôi phải:\n\n1. Đọc `PLAN.md` phần S16.\n2. Đọc SPEC §19–21, TV-06 và acceptance criteria scroll-area trong PRD.\n3. Kiểm tra repo/branch và kết quả CI S15.\n4. Chỉ triển khai S16.\n5. Kết thúc với candidate detection, target snapshot/revalidation, 2D internal-scroll tile plan, crop/overlap resolution, sticky-child policy, exact restore và E2E cho nested scroll, wide table và modal/chat-like panel.",
          )

          benchmark = Path("docs/benchmarks.md")
          benchmark_text = benchmark.read_text()
          replace_exact(
              "docs/benchmarks.md",
              "## Latest validated run\n\nThe final S15 completion update must add the clean GitHub Actions run ID, environment, test counts, and measured JSON output here. Measurements must never be copied from a failed or partially skipped run.",
              """## Latest validated run

Implementation validation completed in GitHub Actions run `30871783639` on Ubuntu 24.04 with Node.js 22.22.0, pnpm 11.15.1, and Chrome for Testing 151.0.7922.34.

- formatting, lint, and strict TypeScript passed;
- 239 unit tests passed across 66 files;
- four deterministic PDF benchmark cases passed;
- the Manifest V3 production build was verified;
- 20 Playwright extension E2E cases passed in 2.5 minutes.

| Scenario | Tiles | Pages | Duration | PDF bytes | Max decoded | Max canvas pixels | Estimated working set | Guard threshold | Peak heap |
| --- | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: | ---: |
| 1,440 × 10k | 2 | 5 | 26.04 ms | 5,070 | 1 | 3,003,840 | 95,884,512 B | 483,183,820 B | 18,958,192 B |
| 1,440 × 30k | 4 | 15 | 29.11 ms | 13,888 | 1 | 3,003,840 | 95,884,512 B | 483,183,820 B | 21,339,352 B |
| 1,440 × 100k | 13 | 48 | 50.23 ms | 43,332 | 1 | 3,003,840 | 95,884,512 B | 483,183,820 B | 23,770,784 B |
| 4,096 × 30k wide | 4 | 6 | 7.03 ms | 5,949 | 1 | 24,301,568 | 288,793,969 B | 483,183,820 B | 22,393,096 B |

The durations, source bytes, and output sizes above come from the deterministic lightweight canvas adapter and are architecture-regression references, not real rasterization or JPEG-throughput claims. Browser E2E remains the source of truth for real `OffscreenCanvas`, IndexedDB, runtime messaging, download, and persisted PDF behavior.""",
          )
          PY

      - name: Format completion documents
        run: pnpm exec prettier --write README.md CHANGELOG.md PLAN.md docs/benchmarks.md

      - name: Remove one-time workflow
        run: rm .github/workflows/complete-s15.yml

      - name: Commit S15 completion documents
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete S15 PDF validation documentation"
          git push origin HEAD:agent/s15-pdf-benchmarks

name: S30 targeted E2E

on:
  push:
    branches: [agent/s30-viewer-intelligence-v2]

permissions:
  contents: read

concurrency:
  group: s30-targeted-e2e-${{ github.ref }}
  cancel-in-progress: true

jobs:
  s30:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/s30-viewer-intelligence-v2

      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm format:check
      - run: pnpm typecheck
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test tests/e2e/pdf-viewer-discovery.spec.ts --reporter=line

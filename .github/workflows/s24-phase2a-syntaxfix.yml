name: Retry S24 Completion Services After Syntax Fix

on:
  push:
    branches: [agent/s24-auto-output]

permissions:
  contents: write

concurrency:
  group: s24-phase2a-syntaxfix
  cancel-in-progress: true

jobs:
  apply:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out S24 branch
        uses: actions/checkout@v4
        with:
          ref: agent/s24-auto-output
          fetch-depth: 0

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply, validate, and publish a clean result
        shell: bash
        run: |
          set +e
          : > /tmp/s24-phase2a.log
          git show f4b9c3c40e95e6ed175f129ccf51f49ce9f4e219:scripts/s24-phase2a-apply.py > /tmp/s24-phase2a-apply.py
          python /tmp/s24-phase2a-apply.py >> /tmp/s24-phase2a.log 2>&1
          status=$?

          if [ "$status" -eq 0 ]; then
            python - <<'PY' >> /tmp/s24-phase2a.log 2>&1
          from pathlib import Path

          image_test = Path('tests/unit/tiled-image-export-service.test.ts')
          text = image_test.read_text()
          old = '''            ),
      },
      now: () => NOW,'''
          new = '''            ),
          ),
      },
      now: () => NOW,'''
          if text.count(old) != 1:
              raise SystemExit(f'Expected one Promise.reject close anchor, found {text.count(old)}')
          image_test.write_text(text.replace(old, new))

          for path_name in [
              'tests/unit/tiled-image-export-service.test.ts',
              'tests/unit/capture-completion-service.test.ts',
          ]:
              path = Path(path_name)
              value = path.read_text()
              old_transition = '      transition: (_id, state, patch = {}) => {\n        transitions.push(state);'
              new_transition = '      transition: (id, state, patch = {}) => {\n        void id;\n        transitions.push(state);'
              if value.count(old_transition) != 1:
                  raise SystemExit(
                      f'Expected one transition mock anchor in {path_name}, found {value.count(old_transition)}'
                  )
              path.write_text(value.replace(old_transition, new_transition))
          PY
            status=$?
          fi

          if [ "$status" -eq 0 ]; then
            pnpm exec prettier --write \
              src/background/capture-completion-policy.ts \
              src/background/capture-output.ts \
              src/background/tiled-image-export-service.ts \
              src/background/capture-completion-service.ts \
              src/background/job-coordinator.ts \
              src/background/job-state-machine.ts \
              src/background/pdf-export-service.ts \
              src/shared/contracts/domain.ts \
              src/storage/artifact-repository.ts \
              tests/unit/capture-completion-policy.test.ts \
              tests/unit/tiled-image-export-service.test.ts \
              tests/unit/capture-completion-service.test.ts >> /tmp/s24-phase2a.log 2>&1
            status=$?
          fi
          if [ "$status" -eq 0 ]; then pnpm lint >> /tmp/s24-phase2a.log 2>&1; status=$?; fi
          if [ "$status" -eq 0 ]; then pnpm typecheck >> /tmp/s24-phase2a.log 2>&1; status=$?; fi
          if [ "$status" -eq 0 ]; then pnpm test:unit >> /tmp/s24-phase2a.log 2>&1; status=$?; fi
          if [ "$status" -eq 0 ]; then pnpm build >> /tmp/s24-phase2a.log 2>&1; status=$?; fi

          git config user.name "OpenAI coding agent"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$status" -eq 0 ]; then
            rm -f docs/sessions/s24-phase2a-diagnostic.md .github/workflows/s24-phase2a-syntaxfix.yml
            git add \
              src/background/capture-completion-policy.ts \
              src/background/capture-output.ts \
              src/background/tiled-image-export-service.ts \
              src/background/capture-completion-service.ts \
              src/background/job-coordinator.ts \
              src/background/job-state-machine.ts \
              src/background/pdf-export-service.ts \
              src/shared/contracts/domain.ts \
              src/storage/artifact-repository.ts \
              tests/unit/capture-completion-policy.test.ts \
              tests/unit/tiled-image-export-service.test.ts \
              tests/unit/capture-completion-service.test.ts \
              docs/sessions/s24-phase2a-diagnostic.md \
              .github/workflows/s24-phase2a-syntaxfix.yml
            git commit -m "Add mode-aware completion services"
          else
            git reset --hard HEAD
            {
              echo '# S24 completion services diagnostic'
              echo
              echo "Exit status: $status"
              echo
              echo '```text'
              tail -c 70000 /tmp/s24-phase2a.log
              echo
              echo '```'
            } > docs/sessions/s24-phase2a-diagnostic.md
            rm .github/workflows/s24-phase2a-syntaxfix.yml
            git add docs/sessions/s24-phase2a-diagnostic.md .github/workflows/s24-phase2a-syntaxfix.yml
            git commit -m "Update S24 completion services diagnostic"
          fi

          git push origin HEAD:agent/s24-auto-output

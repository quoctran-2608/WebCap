name: S23 Recovery Protocol Fix

on:
  push:
    branches: [agent/s23-adaptive-scroll]

permissions:
  contents: write

concurrency:
  group: s23-recovery-protocol-fix
  cancel-in-progress: true

jobs:
  patch-and-verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - name: Check out S23 branch
        uses: actions/checkout@v4
        with:
          ref: agent/s23-adaptive-scroll
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.15.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Apply guarded protocol fix and unit coverage
        run: |
          python - <<'PY'
          from pathlib import Path

          entry = Path('src/content/entry.ts')
          text = entry.read_text()
          helper_anchor = '''function errorResponse(request: PagePreparationRequest, error: unknown): Record<string, unknown> {'''
          helper = '''export function rebindPagePreparationResponse(\n  response: Record<string, unknown>,\n  requestId: string,\n  sentAt: string,\n): Record<string, unknown> {\n  return { ...response, requestId, sentAt };\n}\n\nfunction errorResponse(request: PagePreparationRequest, error: unknown): Record<string, unknown> {'''
          if text.count(helper_anchor) != 1:
              raise SystemExit(f'Expected one response helper anchor, found {text.count(helper_anchor)}')
          text = text.replace(helper_anchor, helper)

          cached_old = '''    if (current.preparationId === preparationId && current.readyResponse !== undefined) {\n      return current.readyResponse as Record<string, unknown>;\n    }'''
          cached_new = '''    if (current.preparationId === preparationId && current.readyResponse !== undefined) {\n      return rebindPagePreparationResponse(\n        current.readyResponse as Record<string, unknown>,\n        request.requestId,\n        new Date().toISOString(),\n      );\n    }'''
          if text.count(cached_old) != 1:
              raise SystemExit(f'Expected one cached response anchor, found {text.count(cached_old)}')
          entry.write_text(text.replace(cached_old, cached_new))

          test = Path('tests/unit/page-preparation-content.test.ts')
          test_text = test.read_text()
          import_old = '''  nextLazyScrollPosition,\n  shouldRestoreCssProperty,'''
          import_new = '''  nextLazyScrollPosition,\n  rebindPagePreparationResponse,\n  shouldRestoreCssProperty,'''
          if test_text.count(import_old) != 1:
              raise SystemExit(f'Expected one test import anchor, found {test_text.count(import_old)}')
          test_text = test_text.replace(import_old, import_new)

          test_anchor = '''  it("accepts only the versioned background-to-content request shape", () => {'''
          test_case = '''  it("re-envelopes an idempotent cached response for the current request", () => {\n    const cached = {\n      protocolVersion: 1,\n      requestId: "request-old",\n      source: "content",\n      target: "background",\n      type: "PAGE_PREPARATION_READY",\n      payload: { preparationId: "job-1" },\n      sentAt: "2026-08-05T00:00:00.000Z",\n    };\n\n    expect(\n      rebindPagePreparationResponse(\n        cached,\n        "request-new",\n        "2026-08-05T00:00:01.000Z",\n      ),\n    ).toEqual({\n      ...cached,\n      requestId: "request-new",\n      sentAt: "2026-08-05T00:00:01.000Z",\n    });\n    expect(cached.requestId).toBe("request-old");\n  });\n\n  it("accepts only the versioned background-to-content request shape", () => {'''
          if test_text.count(test_anchor) != 1:
              raise SystemExit(f'Expected one unit test anchor, found {test_text.count(test_anchor)}')
          test.write_text(test_text.replace(test_anchor, test_case))
          PY
          rm docs/sessions/s23-recovery-diagnostic.md
          rm .github/workflows/s23-recovery-protocol-fix.yml
          pnpm exec prettier --write src/content/entry.ts tests/unit/page-preparation-content.test.ts

      - name: Validate static and focused unit gates
        run: |
          pnpm format:check
          pnpm lint
          pnpm typecheck
          pnpm exec vitest run tests/unit/page-preparation-content.test.ts tests/unit/page-preparation-service.test.ts
          pnpm build

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Verify service-worker restart recovery
        run: pnpm exec playwright test tests/e2e/adaptive-scroll.spec.ts --project=visible-smoke --grep "service-worker restart"

      - name: Commit clean recovery fix
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/content/entry.ts tests/unit/page-preparation-content.test.ts docs/sessions/s23-recovery-diagnostic.md .github/workflows/s23-recovery-protocol-fix.yml
          git commit -m "Fix adaptive recovery preparation protocol"
          git push origin HEAD:agent/s23-adaptive-scroll

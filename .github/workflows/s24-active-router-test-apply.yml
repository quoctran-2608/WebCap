name: S24 Active Router Test Apply

on:
  push:
    branches:
      - agent/s24-auto-output

permissions:
  contents: write

concurrency:
  group: s24-active-router-test-apply
  cancel-in-progress: false

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: agent/s24-auto-output
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.15.1
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22.22.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply and format router test
        run: |
          node scripts/apply-s24-active-router-test.mjs
          pnpm exec prettier --write tests/unit/persistent-job-router.test.ts
          rm scripts/apply-s24-active-router-test.mjs
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Cover terminal output lookup through the router"
          git push origin HEAD:agent/s24-auto-output
